name: PHAR
on:
  push: {tags: ['v*']}
  workflow_dispatch:
jobs:
  phar:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4'}
      - run: composer install --no-interaction
      - run: build/build-phar.sh
      - run: sha256sum build/lockrot.phar > build/lockrot.phar.sha256
      - run: LOCKROT_E2E=1 vendor/bin/phpunit --group e2e --filter PharTest
      - uses: actions/upload-artifact@v4
        with: {name: lockrot.phar, path: 'build/lockrot.phar*'}
      # TODO(release): sign with GPG
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: {files: 'build/lockrot.phar*'}
