name: PHAR
on:
  push: {tags: ['v*']}
  workflow_dispatch:
jobs:
  phar:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4'}
      - run: composer install --no-interaction
      - run: build/build-phar.sh
      # Written from inside build/ so the file reads "<hex>  lockrot.phar": `sha256sum -c` is run by
      # whoever downloaded the PHAR, next to their own copy, not against a build/ path that only
      # exists here. lockrot.phar self-update reads the hash and ignores the name either way.
      - run: cd build && sha256sum lockrot.phar > lockrot.phar.sha256
      - run: LOCKROT_E2E=1 vendor/bin/phpunit --group e2e --filter PharTest
      - uses: actions/upload-artifact@v4
        with: {name: lockrot.phar, path: 'build/lockrot.phar*'}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: {files: 'build/lockrot.phar*'}
  # The PHAR is built on PHP 8.4 but must run on the plugin's floor; run it once on PHP 7.4.
  smoke-php74:
    needs: phar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: {php-version: '7.4'}
      - uses: actions/download-artifact@v4
        with: {name: lockrot.phar, path: build}
      - run: php build/lockrot.phar --version
      - run: php build/lockrot.phar -d tests/fixtures/skeletons/laravel --format=json --target-php=8.4 --offline > /dev/null
