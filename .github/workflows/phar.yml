name: PHAR
on:
  push: {tags: ['v*']}
  workflow_dispatch:
# Every build is signed with the lockrot release key and attested by GitHub. The key's public half
# is lockrot-release-key.asc in the repository root (also on keys.openpgp.org and
# keyserver.ubuntu.com); CI holds only its signing subkey (GPG_PRIVATE_KEY, GPG_PASSPHRASE). The
# signature is checked here against the committed public key, so a key rotation that forgets to
# update the file — or a secret that no longer matches it — fails the build instead of shipping
# an archive nobody can verify with the documented key.
env:
  LOCKROT_SIGNING_KEY: 39ECC3F64AE8D06A9A63FD99AB6F7F52AE513141
jobs:
  phar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release assets
      id-token: write # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4'}
      - run: composer install --no-interaction
      - run: build/build-phar.sh
      # Written from inside build/ so the file reads "<hex>  lockrot.phar": `sha256sum -c` is run by
      # whoever downloaded the PHAR, next to their own copy, not against a build/ path that only
      # exists here. lockrot.phar self-update reads the hash and ignores the name either way.
      - run: cd build && sha256sum lockrot.phar > lockrot.phar.sha256
      # A throw-away GNUPGHOME per step: the signing key never touches the runner's default keyring,
      # and the passphrase travels over a pipe, never in an argument that `ps` could show.
      - name: Sign the PHAR with the release key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          printf '%s\n' "$GPG_PASSPHRASE" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 \
            --local-user "$LOCKROT_SIGNING_KEY" --armor --detach-sign \
            --output build/lockrot.phar.asc build/lockrot.phar
      - name: Verify the signature with the committed public key
        run: |
          export GNUPGHOME="$(mktemp -d)"
          gpg --batch --quiet --import lockrot-release-key.asc
          gpg --batch --status-file build/gpg-status.txt --verify build/lockrot.phar.asc build/lockrot.phar
          # VALIDSIG ends with the primary key's fingerprint: the signature must come from *this* key,
          # not merely from some key the keyring happens to hold.
          grep -E "^\[GNUPG:\] VALIDSIG [0-9A-F]{40} .* ${LOCKROT_SIGNING_KEY}$" build/gpg-status.txt
      - run: LOCKROT_E2E=1 vendor/bin/phpunit --group e2e --filter PharTest
      - uses: actions/attest-build-provenance@v4
        with: {subject-path: build/lockrot.phar}
      - uses: actions/upload-artifact@v7
        with: {name: lockrot.phar, path: 'build/lockrot.phar*'}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with: {files: 'build/lockrot.phar*'}
  # The PHAR is built on PHP 8.4 but must run on the plugin's floor; run it once on PHP 7.4.
  smoke-php74:
    needs: phar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: {php-version: '7.4'}
      - uses: actions/download-artifact@v8
        with: {name: lockrot.phar, path: build}
      - run: php build/lockrot.phar --version
      - run: php build/lockrot.phar -d tests/fixtures/skeletons/laravel --format=json --target-php=8.4 --offline > /dev/null
