name: CI
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        composer: ['2.2', 'latest']
        exclude:
          - {php: '8.5', composer: '2.2'}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Pin composer/composer for the matrix
        run: |
          if [ "${{ matrix.composer }}" = "2.2" ]; then composer require --dev --no-update "composer/composer:~2.2.25"; fi
          composer update --no-interaction --prefer-dist
      - name: Run tests with the matrix Composer binary
        run: |
          if [ "${{ matrix.composer }}" = "2.2" ]; then composer self-update --2.2; fi
          composer -V
          if [ "${{ matrix.php }}" = "7.4" ] || [ "${{ matrix.php }}" = "8.0" ]; then
            vendor/bin/phpunit -c phpunit9.xml.dist
          else
            vendor/bin/phpunit
          fi
      # Composer 2.2 LTS bundles symfony/console 2.8.52 while require-dev resolves 5.4; the plugin e2e test through the
      # real 2.2 binary (table and json output) is the only check that exercises the bundled 2.8 API.
      - name: Run the plugin e2e test through the Composer 2.2 binary
        if: matrix.composer == '2.2'
        env: {LOCKROT_E2E: '1', GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          if [ "${{ matrix.php }}" = "7.4" ] || [ "${{ matrix.php }}" = "8.0" ]; then
            vendor/bin/phpunit -c phpunit9.xml.dist --group e2e --filter PluginTest
          else
            vendor/bin/phpunit --group e2e --filter PluginTest
          fi
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', coverage: pcov}
      - run: composer install --no-interaction
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: vendor/bin/phpstan analyse -c phpstan.tests.neon.dist --memory-limit=1G
      - name: composer-require-checker
        run: |
          composer global require --no-interaction "maglnet/composer-require-checker:^4.24"
          $(composer global config bin-dir --absolute)/composer-require-checker check --config-file=composer-require-checker.json composer.json
      - name: Tests with coverage (whole src, informational)
        run: vendor/bin/phpunit --coverage-text --only-summary-for-coverage-text
      # coverage-check reads the clover <metrics> "elements" attribute (methods + statements + conditionals
      # combined), not PHPUnit's "Lines" %. The gated set measures 97.42% elements (2232/2291, 2026-09-16, src/Data/Forge included);
      # among the uncovered ones are PharUpdater's Windows copy() branch, short-write branch and
      # chmod-refused branch, none of which can be provoked on the runner.
      # The formula would give floor(97.42) - 2 = 95; the gate stays at 94, which the suite clears with
      # ~3 points to spare, so the number does not move every time a file is added.
      - name: Core coverage gate
        run: |
          vendor/bin/phpunit -c phpunit.core-coverage.xml.dist --coverage-clover build/clover-core.xml
          composer global require --no-interaction "rregeer/phpunit-coverage-check:^0.3"
          $(composer global config bin-dir --absolute)/coverage-check build/clover-core.xml 94
  # Its own job, sharded three ways: over the whole src tree one Infection run took 30 minutes on
  # a 4-core runner, and a style or type error should not wait for it. Each shard runs the same
  # configuration filtered to a group of directories, against its own threshold: the shards are
  # unequal populations (measured 2026-09-17: 99.23%, 97.28% and 97.8% covered MSI), and one shared
  # number would leave the middle one two mutants from red. Each threshold is that shard's floor
  # minus one; infection.json5 keeps the whole-tree number for a local run.
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {name: verdicts and output, filter: 'src/Verdict,src/Signal,src/Analyzer,src/Output', min_msi: 98}
          - {name: composer and self-update, filter: 'src/Composer,src/Config,src/SelfUpdate', min_msi: 96}
          - {name: data and the rest, filter: 'src/Data,src/Baseline,src/Allowlist,src/Graph,src/Lock,src/Json,src/Exception,src/Version.php,src/Clock.php,src/Deadline.php', min_msi: 96}
    name: mutation (${{ matrix.shard.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', coverage: pcov}
      - run: composer install --no-interaction
      - name: Install Infection (not in require-dev, PHP ^8.2 floor)
        run: |
          composer global config --no-plugins allow-plugins.infection/extension-installer true
          composer global require "infection/infection:^0.35"
      # Infection 0.35 dropped --only-covered (uncovered code is skipped by default; --with-uncovered opts in).
      # Whole tree, 2026-09-17: 3202 mutants, 56 equivalent escapes, 2 timed out (infinite-loop
      # mutants, i.e. detections) -> MSI = Covered MSI 98.25%; ~6m20s on 8 threads locally, ~30 min
      # unsharded on a 4-core runner. infection.json5 records why the timeout is 180;
      # tests/infection-equivalents.md records why every one of the 56 escapes is equivalent. No
      # GitHub annotations: 56 warnings about documented equivalents per run would only teach people
      # to ignore them; the escape listing is uploaded instead.
      - run: $(composer global config bin-dir --absolute)/infection --threads=max --min-msi=${{ matrix.shard.min_msi }} --min-covered-msi=${{ matrix.shard.min_msi }} --filter='${{ matrix.shard.filter }}'
      - if: always()
        uses: actions/upload-artifact@v7
        with: {name: 'infection (${{ matrix.shard.name }})', path: build/infection.log, if-no-files-found: ignore}
  # docs/ is rendered at lockrot.dev from the newest tag by the somework/lockrot.dev repository;
  # --strict here is the only place a broken link or a page outside the nav fails before a release.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version-file: .python-version, cache: pip, cache-dependency-path: docs/requirements.txt}
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4'}
      - run: composer install --no-interaction
      - run: LOCKROT_E2E=1 vendor/bin/phpunit --group e2e --filter PluginTest
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
      # The token is what lets ComposerHttpClientNetworkTest prove that Composer's github-oauth and
      # lockrot's own header no longer meet on the wire; without it that test is skipped.
      - run: vendor/bin/phpunit --group network
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
  # PharTest is the only check that the PHAR still exposes lockrot's two commands and nothing else,
  # and that it never loads the inspected project's classes. phar.yml builds on tags alone, so
  # without this job a regression in bin/lockrot would merge green and surface at release time.
  phar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', tools: 'composer:2.10.3'}
      - run: composer install --no-interaction
      # build/phar/composer.lock records lockrot's own require and autoload as they were when the
      # lock was written, and `composer install` does not notice when composer.json in the root
      # changes them (the lock's content-hash covers build/phar/composer.json alone). Refresh the
      # entry and fail if that changes the lock: the fix is to commit the refreshed lock.
      - run: composer update somework/lockrot --no-install --no-plugins --no-interaction --working-dir=build/phar
      - run: git diff --exit-code build/phar/composer.lock
      - run: build/build-phar.sh
      - run: LOCKROT_E2E=1 vendor/bin/phpunit --group e2e --filter PharTest
      - uses: actions/upload-artifact@v7
        with: {name: lockrot.phar, path: build/lockrot.phar}
  # The build is reproducible (build/build-phar.sh says what is pinned): a second runner, on the
  # next PHP, builds the same commit from scratch and must produce the same bytes, so a change
  # that makes the archive depend on the machine — a fresh dependency resolution, a random
  # autoloader suffix, a timestamp, an absolute path, a zlib or tokenizer difference between PHP
  # versions — fails here instead of at the first outside rebuild of a release. Composer is pinned
  # to the release workflow's version because it writes vendor/composer/*.php from its own source.
  phar-reproducible:
    runs-on: ubuntu-latest
    needs: phar
    steps:
      # The commit the first job built, spelled out: on a pull request the merge ref can be
      # rewritten between the two jobs, and that must fail rather than compare two sources.
      - uses: actions/checkout@v7
        with: {ref: '${{ github.sha }}'}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.5', tools: 'composer:2.10.3'}
      - uses: actions/download-artifact@v8
        with: {name: lockrot.phar, path: build/first}
      - run: build/build-phar.sh
      - run: cmp build/first/lockrot.phar build/lockrot.phar && echo "byte-identical rebuild"
