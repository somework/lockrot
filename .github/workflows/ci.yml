name: CI
# A push runs CI only on main, release/** and integration/**, so another branch with an open PR runs
# once per push, on its pull_request event. A push to one of those branches runs the mutation gate
# over the whole tree, so a direct push to a release branch gets every job. A final tag runs
# phar.yml, and an rc tag runs full-check.yml, not this file. A new push to a PR cancels the run for
# the old head, because the ruleset waits for the new head's checks. On main, every push gets a
# group of its own: GitHub cancels a pending run when a newer run joins its group, and phar.yml
# refuses a tag whose commit has no successful push run. On another pushed branch, a newer push
# replaces a pending run. full-check.yml, not this file, runs on a push to release/full-check-**.
on:
  push:
    branches: [main, 'release/**', 'integration/**', '!release/full-check-**']
  pull_request:
# No job of this workflow writes to the repository: the token reads only.
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # A style or type error stops the run before the rows take runners. On a push the rows still end
  # before the mutation shards, so the wait costs no time there.
  # Measurements: https://github.com/somework/lockrot/pull/110
  tests:
    needs: quality
    runs-on: ubuntu-latest
    name: tests (${{ matrix.php }}, ${{ matrix.composer }})
    strategy:
      fail-fast: false
      # A pull request into a branch other than main runs the rows below. They hold each PHPUnit major
      # that composer.json allows, because the majors read options and events differently. The
      # rows resolve 9.6 on 7.4 and 8.0, 10.5 on 8.1 only, and 11.5 on 8.2 and later. They also
      # hold both PHPUnit configurations and both ends of the PHP range. A pull request into main and
      # a push run them all. A ruleset requires a check by its job name, so a renamed row drops out
      # of the ruleset. lockrot supports Composer 2.10 and later (composer.json), so every row runs
      # the newest composer/composer that require-dev allows.
      # The covers-nothing tests pin their target PHP, so they run on the two covers_nothing rows,
      # at both ends of PHP. Each row runs the runtime-php group.
      matrix: >-
        ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref != 'main' && '{
        "include": [
        {"php": "7.4", "composer": "latest", "covers_nothing": true},
        {"php": "8.0", "composer": "latest"},
        {"php": "8.1", "composer": "latest"},
        {"php": "8.5", "composer": "latest", "covers_nothing": true}]}' || '{
        "php": ["7.4", "8.0", "8.1", "8.2", "8.3", "8.4", "8.5"],
        "composer": ["latest"],
        "include": [
        {"php": "7.4", "composer": "latest", "covers_nothing": true},
        {"php": "8.5", "composer": "latest", "covers_nothing": true}]}') }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer update --no-interaction --prefer-dist
      - name: Run tests with the matrix Composer binary
        run: |
          composer -V
          config=phpunit.xml.dist
          if [ "${{ matrix.php }}" = "7.4" ] || [ "${{ matrix.php }}" = "8.0" ]; then config=phpunit9.xml.dist; fi
          # PHPUnit 9.6 and 10.5 apply only the last --exclude-group, and 10.5 warns on a second one.
          # 11.5 warns on a comma list. So a process reads a copy of the configuration with its own
          # <groups>, which each major reads alike. A group list replaces the configuration's list,
          # so each one repeats e2e, network and sweep.
          slow='<group>e2e</group><group>network</group><group>sweep</group>'
          groups_config() {
            sed "s#<groups>.*</groups>#<groups>$2</groups>#" "$config" > "$1"
            # A configuration whose <groups> element the sed does not match runs the wrong groups.
            grep -qF "<groups>$2</groups>" "$1" || { echo "::error::$1 does not hold the <groups> of its process"; return 1; }
          }
          # Processes side by side shorten the row. Each writes its own log, and the step checks every exit code.
          # A runtime-php test reads the PHP that runs it, so a row without covers-nothing still runs it.
          # On a covers_nothing row, schema-sweep holds the longest covers-nothing class and gets a process of its own.
          runs=("<exclude>$slow<group>covers-nothing</group></exclude>")
          if [ "${{ matrix.covers_nothing }}" = "true" ]; then
            runs+=("<include><group>covers-nothing</group></include><exclude>$slow<group>schema-sweep</group></exclude>")
            runs+=("<include><group>schema-sweep</group></include><exclude>$slow</exclude>")
          else
            runs+=("<include><group>runtime-php</group></include><exclude>$slow</exclude>")
          fi
          mkdir -p build
          # The copies stay beside the configuration, because PHPUnit resolves its paths from there.
          # All of them exist before a process starts, so a failed copy leaves no process running.
          for i in "${!runs[@]}"; do groups_config "phpunit-ci-$i.xml" "${runs[$i]}"; done
          pids=()
          for i in "${!runs[@]}"; do
            vendor/bin/phpunit -c "phpunit-ci-$i.xml" > "build/phpunit-$i.log" 2>&1 &
            pids+=($!)
          done
          failed=0
          for i in "${!runs[@]}"; do
            status=0; wait "${pids[$i]}" || status=$?
            echo "=== phpunit ${runs[$i]}: exit $status"; cat "build/phpunit-$i.log"
            if [ "$status" -ne 0 ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi
  # The tests rows exclude MoveCheckComposerOracleTest, or skip it on a composer/composer that
  # recorded none of train 7d's answers. The latest rows follow each new Composer release. This job
  # runs the oracle test once on each recorded version, so the test runs on every head. A ruleset
  # requires a check by its job name, so a renamed job drops out of the ruleset.
  move-check-oracle:
    runs-on: ubuntu-latest
    steps:
      # composer update runs package code, and no later step needs the token.
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: ./.github/actions/move-check-oracle
  # EnginePageCasesTest compares the engine pages only on the composer/composer that recorded them,
  # and the latest rows follow each new Composer release. This job installs the composer/composer of
  # build/phar/composer.lock, which the PHAR bundles and the recording must match, so a skip fails
  # here. A ruleset requires a check by its job name, so a renamed job drops out of the ruleset.
  engine-pages:
    runs-on: ubuntu-latest
    steps:
      # composer install runs package code, and no later step needs the token.
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', coverage: none}
      # composer.lock is not committed, so composer install would take the newest composer/composer.
      - run: composer require --dev --no-update "composer/composer:$(jq -r '.packages[] | select(.name == "composer/composer") | .version' build/phar/composer.lock)"
      - run: composer update --no-interaction --prefer-dist
      - run: vendor/bin/phpunit --fail-on-skipped --fail-on-empty-test-suite tests/Integration/EnginePageCasesTest.php
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', coverage: none}
      - run: composer install --no-interaction
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: vendor/bin/phpstan analyse -c phpstan.tests.neon.dist --memory-limit=1G
      - run: python3 -m unittest discover -s tools/schema/tests -t tools/schema/tests
      # A pull request into main is a release pull request. Its tag is public at once, and Packagist
      # reads it before phar.yml runs, so the renderer check of phar.yml runs here first. VersionTest
      # and ChangedGoldensTest hold the version and the golden pins to the CHANGELOG.
      - name: The release pull request vendors an attested renderer release
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env: {GH_TOKEN: '${{ github.token }}'}
        run: tools/report/check-vendored
      # tools/schema writes the -2 schemas and their negative fixtures (tools/schema/README.md). An edit
      # of a generated file, or a builder change committed without its output, fails here.
      - name: The generated schemas and negatives match tools/schema
        run: |
          python3 tools/schema/build_report2_schema.py
          python3 tools/schema/build_other_schemas.py
          python3 tools/schema/make_negatives.py
          python3 tools/schema/make_negatives_other.py explain-2
          python3 tools/schema/make_negatives_other.py baseline-2
          python3 tools/schema/make_negatives_other.py config-2
          python3 tools/schema/build_sarif_properties_schema.py
          python3 tools/schema/make_negatives_sarif.py
          git add --intent-to-add tests/fixtures/schema/negative tests/fixtures/sarif/negative
          git diff --exit-code -- resources/lockrot-report-2.schema.json resources/lockrot-explain-2.schema.json resources/lockrot-baseline-2.schema.json resources/lockrot-config-2.schema.json tests/fixtures/schema/negative tests/fixtures/sarif/lockrot-sarif-properties-2.schema.json tests/fixtures/sarif/negative
      - name: composer-require-checker
        run: |
          composer global require --no-interaction "maglnet/composer-require-checker:^4.24"
          $(composer global config bin-dir --absolute)/composer-require-checker check --config-file=composer-require-checker.json composer.json
      # lockrot's report-2 on tests/fixtures/apps against the model's documents, on the recorded answers only.
      # tests/fixtures/corpus/model-divergences.json holds each reviewed difference.
      - name: The corpus differential
        run: php tools/corpus/differential.php
  # A job of its own, beside quality: the test rows wait for quality, and this phpunit run is most of
  # quality's time. Measurements: https://github.com/somework/lockrot/pull/110
  core-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', coverage: pcov}
      - run: composer install --no-interaction
      # coverage-check reads the clover "elements" metric (methods, statements and conditionals),
      # not PHPUnit's line percentage. Keep the gate about three points below the measured value, so
      # that a new file does not fail it.
      # Measurement: https://github.com/somework/lockrot/commit/3700c976d5897e2bef16bc5eb4e05620c557176a
      - name: Core coverage gate
        run: |
          vendor/bin/phpunit -c phpunit.core-coverage.xml.dist --coverage-clover build/clover-core.xml
          composer global require --no-interaction "rregeer/phpunit-coverage-check:^0.3"
          $(composer global config bin-dir --absolute)/coverage-check build/clover-core.xml 94
  # This job collects coverage once for all shards, on a push and on a pull request. A pull request
  # that adds, changes or renames no PHP file under src mutates nothing, so the job skips its test
  # run there. full-check.yml runs the same mutation-coverage action.
  mutation-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: "${{ github.event_name == 'pull_request' && '0' || '1' }}"}
      - name: Does this run mutate src
        id: scope
        env: {EVENT: '${{ github.event_name }}', BASE_REF: '${{ github.base_ref }}'}
        run: |
          if [ "$EVENT" = pull_request ] && ! git diff --name-only --diff-filter=AMR "origin/$BASE_REF...HEAD" -- src | grep -q '\.php$'; then
            echo "mutate=false" >> "$GITHUB_OUTPUT"
          else
            echo "mutate=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.mutate == 'true'
        uses: ./.github/actions/mutation-coverage
  mutation:
    # The shards wait for the coverage run and for quality, which run side by side. A style or
    # type error then stops the shards before they take runners. A coverage run after quality
    # puts quality's time on the longest path of every run.
    # Measurements: https://github.com/somework/lockrot/pull/110
    needs: [mutation-coverage, quality]
    runs-on: ubuntu-latest
    # Keep the cap far above a shard's run time: a slow runner cancels a green shard. The cap only
    # stops a runaway run. Measurements: https://github.com/somework/lockrot/pull/6,
    # https://github.com/somework/lockrot/pull/10 and https://github.com/somework/lockrot/pull/111
    timeout-minutes: 80
    # A separate job, so a style or type error does not wait for it. One run over the whole src tree
    # is too slow for one job, so each shard mutates a group of src directories. The shards have
    # unequal populations, and one shared min_msi leaves a shard a few mutants from red. So a
    # shard's min_msi is its covered MSI rounded down, minus one, and a shard cut from another keeps
    # that one's. Every src file must belong to one shard: a file in none is never mutated
    # (tools/mutation/tests/test_mutation_options.py). A shard can list single files of a directory
    # that is too slow for one shard. Measurements: https://github.com/somework/lockrot/pull/65
    # full-check.yml repeats this matrix, and tools/mutation/tests/test_full_check_matrix.py keeps
    # the two equal.
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {name: moves, filter: 'src/Verdict/Move.php src/Verdict/MoveBuilder.php src/Verdict/MoveContext.php src/Verdict/MoveText.php src/Verdict/ListWords.php src/Verdict/MaintenanceMove.php', min_msi: 98}
          - {name: findings, filter: 'src/Verdict/Finding.php src/Verdict/FindingDetails.php src/Verdict/GradedPackage.php src/Verdict/NextStep.php src/Verdict/Score.php src/Verdict/SecurityPartial.php src/Verdict/SecurityStanding.php', min_msi: 98}
          - {name: verdicts, filter: 'src/Verdict/Age.php src/Verdict/CommandArgument.php src/Verdict/FailOn.php src/Verdict/FailOnValue.php src/Verdict/FlagSentence.php src/Verdict/FlagSet.php src/Verdict/Latest.php src/Verdict/MoveChecks.php src/Verdict/MoveDraft.php src/Verdict/MoveFact.php src/Verdict/MoveSubject.php src/Verdict/Moves.php src/Verdict/Replacement.php src/Verdict/ScoreModel.php src/Verdict/ShellCommand.php src/Verdict/ThroughCheck.php src/Verdict/ThroughEntry.php src/Verdict/Verdict.php', min_msi: 98}
          - {name: score, filter: 'src/Score', min_msi: 98}
          - {name: output and security, filter: 'src/Output src/Html src/Explain src/Security', min_msi: 98}
          - {name: signals and analyzer, filter: 'src/Signal src/Analyzer', min_msi: 98}
          - {name: solver, filter: 'src/Solver', min_msi: 98}
          - {name: composer and self-update, filter: 'src/Composer src/Config src/SelfUpdate', min_msi: 96}
          - {name: repository data, filter: 'src/Data/Repository', min_msi: 96}
          - {name: data and the rest, filter: 'src/Data/Forge src/Data/Http src/Data/Cache src/Data/Php src/Data/Advisory src/Data/Abandoned src/Graph src/Baseline src/Filesystem src/Allowlist src/Lock src/Json src/Exception src/Version.php src/Clock.php src/Deadline.php', min_msi: 96}
    name: mutation (${{ matrix.shard.name }})
    steps:
      # A pull request is diffed against its base branch: it needs the history down to the merge base.
      - uses: actions/checkout@v7
        with: {fetch-depth: "${{ github.event_name == 'pull_request' && '0' || '1' }}"}
      # A push mutates the whole tree against the shard's minimum covered MSI. A pull request mutates
      # only its changed lines, where a minimum MSI over few mutants is noise. There,
      # tools/mutation/pr_gate.py fails on an escaped, uncovered, ignored or skipped mutant that
      # tests/infection-equivalents.md does not account for. A ruleset requires a check by its job name, so a renamed shard drops out of the
      # ruleset. Reasons: https://github.com/somework/lockrot/pull/65
      - name: What this shard mutates
        id: scope
        env: {EVENT: '${{ github.event_name }}', BASE_REF: '${{ github.base_ref }}', FILTER: '${{ matrix.shard.filter }}'}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "mode=full" >> "$GITHUB_OUTPUT"; exit 0; fi
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          # members: the files of a directory that the shard lists one by one. Their changed lines are
          # mutated with their whole directory's, and the gate keeps the shard's own mutants.
          dirs=(); files=(); members=()
          for path in $FILTER; do
            if [ -d "$path" ]; then dirs+=("$path"); elif [ "$(dirname "$path")" = src ]; then files+=("$path"); else members+=("$path"); fi
          done
          own=("${dirs[@]}" "${members[@]}")
          for member in "${members[@]}"; do dirs+=("$(dirname "$member")"); done
          dirs=($(printf '%s\n' "${dirs[@]}" | sort -u))
          # Git reads a rename into a file pathspec as an added file, and Infection reads it over the
          # directories as a rename. So the diff runs over the directories and keeps the shard's own paths.
          mine() { while read -r path; do for o in "${own[@]}"; do case "$path" in "$o" | "$o"/*) echo "$path"; break ;; esac; done; done; }
          changed_dirs=""
          if [ ${#dirs[@]} -gt 0 ]; then changed_dirs=$(git diff --name-only --diff-filter=AM "$base" HEAD -- "${dirs[@]}" | grep '\.php$' | mine || true); fi
          changed_files=""
          if [ ${#files[@]} -gt 0 ]; then changed_files=$(git diff --name-only --diff-filter=AM "$base" HEAD -- "${files[@]}" | tr '\n' ' '); fi
          # --git-diff-lines reads added and modified files only. A renamed file is mutated whole, by path.
          renamed=""
          if [ ${#dirs[@]} -gt 0 ]; then renamed=$(git diff --name-only --diff-filter=R "$base" HEAD -- "${dirs[@]}" | grep '\.php$' | mine | tr '\n' ' ' || true); fi
          changed_files=$(echo $changed_files $renamed)
          if [ -z "$changed_dirs" ] && [ -z "$changed_files" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "This pull request changes no source file of this shard: nothing to mutate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "mode=diff" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "dirs=${dirs[*]}" >> "$GITHUB_OUTPUT"
          echo "diff=$([ -n "$changed_dirs" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "files=$changed_files" >> "$GITHUB_OUTPUT"
      # The action holds the reasons for ulimit and the Infection options that the diff steps share.
      - if: steps.scope.outputs.mode != 'none'
        uses: ./.github/actions/mutation-shard
        with: {filter: '${{ matrix.shard.filter }}', min-msi: '${{ matrix.shard.min_msi }}', full: "${{ steps.scope.outputs.mode == 'full' }}"}
      # Infection refuses positional paths with --git-diff-lines and reads changed lines only under its
      # configured source directories, so the shard's directories become a copy of the configuration.
      # A file at the root of src cannot be one. When the pull request changes it, it is mutated whole.
      # So is a renamed file, which --git-diff-lines does not read.
      - name: Mutate whole the root and renamed files the pull request changes
        if: steps.scope.outputs.mode == 'diff' && steps.scope.outputs.files != ''
        run: |
          ulimit -v 4194304
          $(composer global config bin-dir --absolute)/infection --threads=max --only-covering-test-cases --coverage=build/coverage --skip-initial-tests --with-uncovered --min-msi=0 --min-covered-msi=0 ${{ steps.scope.outputs.files }}
          if [ -f build/infection.log ]; then mv build/infection.log build/infection-files.log; fi
          if [ -f build/infection.json ]; then mv build/infection.json build/infection-files.json; fi
      - name: Mutate the lines the pull request changes
        if: steps.scope.outputs.mode == 'diff' && steps.scope.outputs.diff == 'true'
        run: |
          python3 tools/mutation/shard_config.py infection.json5 ${{ steps.scope.outputs.dirs }} > infection.shard.json5
          ulimit -v 4194304
          $(composer global config bin-dir --absolute)/infection --configuration=infection.shard.json5 --threads=max --only-covering-test-cases --coverage=build/coverage --skip-initial-tests --git-diff-lines --git-diff-base=${{ steps.scope.outputs.base }} --with-uncovered --min-msi=0 --min-covered-msi=0
      # --paths keeps the shard's own mutants: a shard of single files mutates their whole directory's lines.
      - name: Mutants against tests/infection-equivalents.md
        if: steps.scope.outputs.mode == 'diff'
        env: {FILTER: '${{ matrix.shard.filter }}'}
        run: |
          logs=(); for log in build/infection.json build/infection-files.json; do if [ -f "$log" ]; then logs+=("$log"); fi; done
          if [ ${#logs[@]} -eq 0 ]; then echo "The changed lines hold no code Infection mutates." | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          status=0; python3 tools/mutation/pr_gate.py --paths "$FILTER" "${logs[@]}" tests/infection-equivalents.md > gate.md || status=$?
          cat gate.md >> "$GITHUB_STEP_SUMMARY"; cat gate.md; exit $status
      - if: always()
        uses: actions/upload-artifact@v7
        with: {name: 'infection (${{ matrix.shard.name }})', path: 'build/infection*.log', if-no-files-found: ignore}
  # somework/lockrot.dev renders docs/ from the newest tag. Before a release, --strict fails on a
  # broken link, a link to a missing anchor or a page outside the nav. mkdocs.yml's `validation`
  # block makes the last two warnings: by default mkdocs prints them as info lines, which --strict
  # lets through.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version-file: .python-version, cache: pip, cache-dependency-path: docs/requirements.txt}
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      # AI sessions on this repository load .claude/rules/. Hold it to the budget that
      # https://github.com/somework/lockrot/pull/66 set.
      - name: .claude/rules/ stays within its line budget
        shell: bash
        env: {BUDGET: '440'}
        run: |
          lines=$(find .claude/rules -name '*.md' -exec cat {} + | wc -l)
          echo "$lines of $BUDGET lines in .claude/rules/"
          test "$lines" -le "$BUDGET"
  # This job proves that the corpus checks read lockrot's output at all. Every problem key that a
  # check can emit has a recorded document mutated to emit that key, or a reason why no mutation can
  # reach it. The tests use no network, token or clock, and need no package: the tool is
  # stdlib-only Python.
  corpus-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version-file: .python-version}
      - run: python -m compileall -q tools/corpus
      - run: python -m unittest discover -s tools/corpus/tests -t tools/corpus/tests
      # The lockrot.schema guard of the corpus diff, one row per pair of document numbers.
      - name: 'corpus diff: report-1 vs report-1'
        run: python -m unittest -v -k report_1_against_report_1 test_manifest_and_diff
        working-directory: tools/corpus/tests
      - name: 'corpus diff: report-1 vs report-2, both orders and a mixed run'
        run: python -m unittest -v -k report_1_against_report_2 -k report_2_against_report_1 -k both_numbers test_manifest_and_diff
        working-directory: tools/corpus/tests
      - name: 'corpus diff: report-2 vs report-2'
        run: python -m unittest -v -k report_2_against_report_2 test_manifest_and_diff
        working-directory: tools/corpus/tests
      # The pull-request mutation gate and its shard configuration, also stdlib-only Python.
      - run: python -m compileall -q tools/mutation
      - run: python -m unittest discover -s tools/mutation/tests -t tools/mutation/tests
  # The TypeScript contract of report-2 (types/, tools/schema/ts/emit_dts.py) and a second JSON
  # Schema validator. npm ci installs only what tools/schema/node/package-lock.json pins.
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: tools/schema/node}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version-file: .python-version}
      - uses: actions/setup-node@v7
        with: {node-version: '24', cache: npm, cache-dependency-path: tools/schema/node/package-lock.json}
      - run: npm ci --ignore-scripts
      - name: The generated unions, probes and bundle module match their sources
        run: |
          python3 ../ts/emit_dts.py
          node emit_bundle.js
          git diff --exit-code -- ../../../types/lockrot-report-2.known.d.ts ../ts/known-map.json ../ts/probes.generated.ts ../../../tests/fixtures/bundle.generated.ts
      - run: node union_parity.js
      - run: node dts_check.js
      - run: node ajv_all.js
      - run: node ajv_recipe.js
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4'}
      - run: composer install --no-interaction
      - run: LOCKROT_E2E=1 vendor/bin/phpunit --group e2e --filter PluginTest
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
      # ComposerHttpClientNetworkTest needs the token to prove that Composer's github-oauth and
      # lockrot's own header do not meet on the wire. Without the token, the test skips.
      - run: vendor/bin/phpunit --group network
        env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
  # PharTest checks that the PHAR exposes lockrot's two commands and nothing else, and that it never
  # loads the inspected project's classes. phar.yml builds on tags alone, so without this job a
  # regression in bin/lockrot can merge green and show only at release time.
  phar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.4', tools: 'composer:2.10.3'}
      - run: composer install --no-interaction
      # build/phar/composer.lock records lockrot's own require and autoload, and `composer install` does
      # not notice when the root composer.json changes them (the lock's content-hash covers
      # build/phar/composer.json alone). Refresh the entry and fail if that changes the lock: the fix
      # is to commit the refreshed lock.
      - run: composer update somework/lockrot --no-install --no-plugins --no-interaction --working-dir=build/phar
      - run: git diff --exit-code build/phar/composer.lock
      - run: build/build-phar.sh
      - run: LOCKROT_E2E=1 vendor/bin/phpunit --group e2e --filter PharTest
      # The PHAR validates extra.lockrot and the baseline with the justinrainbow/json-schema of
      # build/phar/composer.lock, which the tests rows do not install.
      - name: The schema fixtures validate with the PHAR's justinrainbow/json-schema
        run: LOCKROT_JR_VENDOR=build/phar/vendor vendor/bin/phpunit --bootstrap tests/json-schema-bootstrap.php tests/Integration/JsonSchemaConformanceTest.php
      # This step runs the release workflow's signing helper with a throw-away key: wrap and unwrap
      # must round-trip, openssl must accept the unwrapped bytes, and the archive's verifier must
      # refuse a signature by a key that is not the release key.
      - name: Self-update signature helper round trip
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/throwaway.pem
          openssl pkey -in /tmp/throwaway.pem -pubout -out /tmp/throwaway.pub
          openssl dgst -sha384 -sign /tmp/throwaway.pem -out /tmp/sig.bin build/lockrot.phar
          build/selfupdate-signature.php wrap /tmp/sig.bin > /tmp/sig.json
          build/selfupdate-signature.php unwrap /tmp/sig.json | cmp - /tmp/sig.bin
          build/selfupdate-signature.php unwrap /tmp/sig.json > /tmp/sig2.bin
          openssl dgst -sha384 -verify /tmp/throwaway.pub -signature /tmp/sig2.bin build/lockrot.phar
          if build/selfupdate-signature.php verify build/lockrot.phar /tmp/sig.json; then echo "a foreign key must be refused" >&2; exit 1; fi
          rm -f /tmp/throwaway.pem /tmp/throwaway.pub /tmp/sig.bin /tmp/sig.json /tmp/sig2.bin
      - uses: actions/upload-artifact@v7
        with: {name: lockrot.phar, path: build/lockrot.phar}
  # The build is reproducible (build/build-phar.sh says what is pinned): a second runner, on the
  # next PHP, builds the same commit from scratch and must produce the same bytes, so a change
  # that makes the archive depend on the machine — a fresh dependency resolution, a random
  # autoloader suffix, a timestamp, an absolute path, a zlib or tokenizer difference between PHP
  # versions — fails here instead of at the first outside rebuild of a release. Composer is pinned
  # to the release workflow's version because it writes vendor/composer/*.php from its own source.
  phar-reproducible:
    runs-on: ubuntu-latest
    needs: phar
    steps:
      # The commit the first job built, spelled out: on a pull request the merge ref can be
      # rewritten between the two jobs, and that must fail rather than compare two sources.
      - uses: actions/checkout@v7
        with: {ref: '${{ github.sha }}'}
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.5', tools: 'composer:2.10.3'}
      - uses: actions/download-artifact@v8
        with: {name: lockrot.phar, path: build/first}
      - run: build/build-phar.sh
      - run: cmp build/first/lockrot.phar build/lockrot.phar && echo "byte-identical rebuild"
