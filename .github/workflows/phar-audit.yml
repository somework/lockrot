# The PHAR bundles the production dependencies of build/phar/composer.lock. .github/dependabot.yml
# has one composer entry (directory "/", development dependencies only), so nothing else reports
# an advisory against them. The audit runs on a change of the lock and weekly, because an advisory
# appears without a change in the lock. On a red run, update the named package with `composer
# update` in build/phar/ and commit the lock. --abandoned=report keeps an abandoned package from failing it.
name: phar-audit
on:
  pull_request:
    paths:
      - 'build/phar/composer.lock'
      - '.github/workflows/phar-audit.yml'
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:2.10.3
      - run: composer audit --locked --abandoned=report --no-interaction --working-dir=build/phar
