name: full-check
# A full check pushes a pull request's head unchanged to release/full-check-<sha>. This workflow runs
# there the whole-tree mutation gate that ci.yml runs on a push to main or release/**, and nothing
# else: the pull request's own run has checked every other job on that commit. ci.yml ignores these
# branches. The two workflows share .github/actions/mutation-coverage and
# .github/actions/mutation-shard, and tools/mutation/tests/test_full_check_matrix.py keeps the shard
# matrix equal to the one in ci.yml. A branch named release/full-check-<sha>--solver,verdicts runs only
# those shards, so a check of one shard's MSI does not hold a runner per shard for the whole cap.
# tools/mutation/full_check_subset.py gives the naming rule.
on:
  push:
    branches: ['release/full-check-**']
# No job of this workflow writes to the repository: the token reads only.
permissions:
  contents: read
jobs:
  subset:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.subset.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
      - id: subset
        env: {REF: '${{ github.ref_name }}'}
        # An assignment, not `echo "shards=$(...)"`: bash -e stops on the script's failure only there.
        run: |
          shards=$(python3 tools/mutation/full_check_subset.py "$REF" .github/workflows/full-check.yml)
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "This full check mutates the shards $shards." >> "$GITHUB_STEP_SUMMARY"
  # A misspelt shard name fails the subset job before this job takes a runner for the coverage run.
  mutation-coverage:
    needs: subset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mutation-coverage
  mutation:
    needs: [subset, mutation-coverage]
    runs-on: ubuntu-latest
    # The mutation job of ci.yml gives the reasons for the cap and for the shards.
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        shard:
          - {name: verdicts, filter: 'src/Verdict', min_msi: 98}
          - {name: score, filter: 'src/Score', min_msi: 98}
          - {name: output and security, filter: 'src/Output src/Html src/Explain src/Security', min_msi: 98}
          - {name: signals and analyzer, filter: 'src/Signal src/Analyzer', min_msi: 98}
          - {name: solver, filter: 'src/Solver', min_msi: 98}
          - {name: composer and self-update, filter: 'src/Composer src/Config src/SelfUpdate', min_msi: 96}
          - {name: repository data, filter: 'src/Data/Repository', min_msi: 96}
          - {name: data and the rest, filter: 'src/Data/Forge src/Data/Http src/Data/Cache src/Data/Php src/Data/Advisory src/Data/Abandoned src/Graph src/Baseline src/Filesystem src/Allowlist src/Lock src/Json src/Exception src/Version.php src/Clock.php src/Deadline.php', min_msi: 96}
    name: mutation (${{ matrix.shard.name }})
    # A job's `if` cannot read the matrix, so a shard outside the subset still starts, and its steps skip.
    steps:
      - if: "!contains(fromJSON(needs.subset.outputs.shards), matrix.shard.name)"
        run: echo "The branch name leaves this shard out of the full check, so it mutates nothing." >> "$GITHUB_STEP_SUMMARY"
      - if: contains(fromJSON(needs.subset.outputs.shards), matrix.shard.name)
        uses: actions/checkout@v7
      - if: contains(fromJSON(needs.subset.outputs.shards), matrix.shard.name)
        uses: ./.github/actions/mutation-shard
        with: {filter: '${{ matrix.shard.filter }}', min-msi: '${{ matrix.shard.min_msi }}', full: 'true'}
      - if: always() && contains(fromJSON(needs.subset.outputs.shards), matrix.shard.name)
        uses: actions/upload-artifact@v7
        with: {name: 'infection (${{ matrix.shard.name }})', path: 'build/infection*.log', if-no-files-found: ignore}
