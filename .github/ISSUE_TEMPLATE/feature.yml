name: Feature request
description: A signal, an output format, or an option lockrot does not have yet
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out about your dependencies?
      description: Describe the situation, not the implementation. What does lockrot miss today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you want lockrot to do?
      description: A new verdict, an option, an output format, a configuration key.
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: What are you doing instead right now?
    validations:
      required: false
