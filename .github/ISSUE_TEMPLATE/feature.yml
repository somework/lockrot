name: Feature request
description: A signal, an output format or an option that lockrot does not have
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out about your dependencies?
      description: Describe the situation, not the implementation. What does lockrot miss?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What do you want lockrot to do?
      description: A new verdict, an option, an output format, a configuration key.
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: What do you do instead?
    validations:
      required: false
