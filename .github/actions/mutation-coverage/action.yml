name: Mutation coverage
description: Collects the coverage that every mutation shard reads and uploads it as the mutation-coverage artifact.
runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@v2
      with: {php-version: '8.4', coverage: pcov, extensions: pcntl}
    - run: composer install --no-interaction
      shell: bash
    # Keep the --exclude-group list equal to testFrameworkOptions in infection.json5: each shard reads
    # this coverage as its own run's.
    - run: vendor/bin/phpunit --exclude-group=e2e --exclude-group=network --exclude-group=sweep --exclude-group=covers-nothing --coverage-xml=build/coverage/coverage-xml --log-junit=build/coverage/junit.xml
      shell: bash
    - uses: actions/upload-artifact@v7
      with: {name: mutation-coverage, path: build/coverage, retention-days: 1}
