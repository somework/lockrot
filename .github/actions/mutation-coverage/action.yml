name: Mutation coverage
description: Collects the coverage that every mutation shard reads and uploads it as the mutation-coverage artifact.
runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
      with: {php-version: '8.4', coverage: pcov, extensions: pcntl}
    # The shards read this coverage, so it comes from the composer/composer that they install.
    - name: Install the dependencies with the composer/composer of build/phar/composer.lock
      shell: bash
      run: |
        composer require --dev --no-update "composer/composer:$(jq -r '.packages[] | select(.name == "composer/composer") | .version' build/phar/composer.lock)"
        composer update --no-interaction --prefer-dist
    # Keep the --exclude-group list equal to testFrameworkOptions in infection.json5: each shard reads
    # this coverage as its own run's. renderer-manifest fails on a new contract bundle until the
    # renderer is vendored again, and a failed coverage run skips every shard of the pull request.
    - run: vendor/bin/phpunit --exclude-group=e2e --exclude-group=network --exclude-group=sweep --exclude-group=covers-nothing --exclude-group=renderer-manifest --coverage-xml=build/coverage/coverage-xml --log-junit=build/coverage/junit.xml
      shell: bash
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with: {name: mutation-coverage, path: build/coverage, retention-days: 1}
