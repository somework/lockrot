name: Mutation shard
description: Installs Infection, downloads the mutation-coverage artifact and, in full mode, mutates the shard's whole filter.
inputs:
  filter:
    description: The src directories and files of the shard.
    required: true
  min-msi:
    description: The shard's minimum MSI and minimum covered MSI, read in full mode.
    required: true
  full:
    description: "'true' mutates the whole filter. Else the caller mutates what it chooses."
    required: true
runs:
  using: composite
  steps:
    # pcntl: a mutant's test that never ends is stopped by an alarm (tests/Support/MutantTestTimeLimit.php).
    # No coverage driver: Infection reads the coverage of the mutation-coverage job, and a loaded
    # pcov slows every mutant process. Measurements: https://github.com/somework/lockrot/pull/113
    - uses: shivammathur/setup-php@v2
      with: {php-version: '8.4', coverage: none, extensions: pcntl}
    # The gate compares a set of mutants with tests/infection-equivalents.md, so the set must follow
    # from the commit. composer.lock is not committed, so composer install would take the newest
    # composer/composer. Pin the one of build/phar/composer.lock, as the coverage run does, and one
    # Infection release. A bump of either is a reviewed change.
    - name: Install the dependencies with the composer/composer of build/phar/composer.lock
      shell: bash
      run: |
        composer require --dev --no-update "composer/composer:$(jq -r '.packages[] | select(.name == "composer/composer") | .version' build/phar/composer.lock)"
        composer update --no-interaction --prefer-dist
    - name: Install Infection (not in require-dev, PHP ^8.2 floor)
      shell: bash
      run: |
        composer global config --no-plugins allow-plugins.infection/extension-installer true
        composer global require "infection/infection:0.35.4"
    # Infection 0.35 skips uncovered code by default, and --with-uncovered opts in. With it, the MSI
    # counts uncovered mutants, so --min-msi=0, and the covered MSI keeps the shard's floor.
    # infection.json5 gives the reason for its timeout, and tests/infection-equivalents.md the reason
    # for each documented escape. The job writes no GitHub annotations: annotations for documented
    # equivalents on every run teach people to ignore them. The job uploads the escape listing.
    #
    # --only-covering-test-cases: a mutant runs only the test methods that cover its line. A test that
    # never runs the line cannot kill the mutant. Without the option, a surviving mutant runs every
    # slow method of each class that covers it. Measurements: https://github.com/somework/lockrot/pull/65
    - uses: actions/download-artifact@v8
      with: {name: mutation-coverage, path: build/coverage}
    # ulimit caps each process of the mutation steps. A mutant that loops without end then dies
    # in a fatal error that Infection counts, not in an OOM that kills the runner. The memory_limit
    # of phpunit.xml.dist (-1) wins over php -d, because PHPUnit applies its <ini> at run time.
    - name: Mutate the shard (full run)
      if: inputs.full == 'true'
      shell: bash
      env: {FILTER: '${{ inputs.filter }}', MIN_MSI: '${{ inputs.min-msi }}'}
      run: ulimit -v 4194304 && $(composer global config bin-dir --absolute)/infection --threads=max --only-covering-test-cases --coverage=build/coverage --skip-initial-tests --with-uncovered --min-msi=0 --min-covered-msi="$MIN_MSI" $FILTER
    # --report-only: the table is the triage list of the mutants that no entry names, and it fails nothing.
    - name: Mutants against tests/infection-equivalents.md (report only)
      if: always() && inputs.full == 'true' && hashFiles('build/infection.json') != ''
      shell: bash
      env: {FILTER: '${{ inputs.filter }}'}
      run: |
        python3 tools/mutation/pr_gate.py --shard "$FILTER" --report-only build/infection.json tests/infection-equivalents.md > gate.md
        cat gate.md >> "$GITHUB_STEP_SUMMARY"; cat gate.md
