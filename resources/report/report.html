.detail-timeline-strip {

}
.detail-timeline-tail,

}

}
.detail-timeline-dot {

  height: 7px;

}
.detail-timeline-guide,
.detail-timeline-guide-cap {

}
.detail-timeline-guide.is-high,
.detail-timeline-guide-cap.is-high {
  --guide: 1px dotted color-mix(in srgb, var(--tone) 55%, transparent);
}
.detail-timeline-guide {
  position: absolute;
  top: 0;
  bottom: -1px;
  left: var(--x);
  border-left: var(--guide);
}
.detail-timeline-head > .detail-timeline-strip-head {
  position: relative;
  align-self: stretch;
  min-height: 16px;

.detail-timeline-guide-cap {

  bottom: -6px;

  text-transform: none;

.detail-timeline-guide-cap.is-right {
  left: var(--x);
  padding-left: 4px;
  border-left: var(--guide);
}
.detail-timeline-guide-cap.is-left {
  right: calc(100% - var(--x) - var(--guide-w));
  padding-right: 4px;
  border-right: var(--guide);
}
.detail-timeline-row.is-mine {

.detail-timeline-row.is-mine.is-toned {

.detail-timeline-row.is-mine::before,
.detail-timeline-row.is-newest::before {
  content: "";
  position: absolute;
  left: 0;
  top: 5px;
  bottom: 5px;
  width: 3px;
  border-radius: 2px;
  background: var(--ink);
}
.detail-timeline-row.is-mine .detail-timeline-branch,

}
.detail-timeline-row.is-mine .detail-timeline-tail {
  height: 4px;
  border-radius: 2px;
  background: var(--ink-2);
}
.detail-timeline-row.is-mine.is-toned .detail-timeline-tail {
  background: var(--tone);
}
.detail-timeline-row.is-mine .detail-timeline-dot {
  width: 14px;
  height: 14px;
  border: 3px solid var(--ink);
  background: var(--surface);
}
.detail-timeline-row.is-snapshot .detail-timeline-dot {
  width: 12px;
  height: 12px;
  border-radius: 2px;
  transform: translate(-50%, -50%) rotate(45deg);
}
.detail-timeline-row.is-newest::before {
  background: var(--accent);
}
.detail-timeline-row.is-newest .detail-timeline-branch {
  color: var(--accent-ink);
  font-weight: 600;
}
.detail-timeline-row.is-newest .detail-timeline-latest {
  color: var(--ink);
}
.detail-timeline-row.is-newest .detail-timeline-tail {
  height: 2px;
  border-radius: 1px;
  background: var(--muted);
}
.detail-timeline-row.is-newest .detail-timeline-dot {
  width: 10px;
  height: 10px;
  background: var(--accent);
  border-color: var(--accent);
}
.detail-timeline-row.is-folded .detail-timeline-branch,
.detail-timeline-row.is-folded .detail-timeline-latest {
  color: var(--muted);
}
.detail-timeline-fold-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font: 12px var(--sans);
  color: var(--ink-2);
  background: none;
  border: 0;
  padding: 4px 0;

  white-space: nowrap;
}
.detail-timeline-fold-btn:hover {
  color: var(--ink);
}
.detail-timeline-fold-btn::before {
  content: "";
  width: 0;
  height: 0;
  border-style: solid;
  border-width: 4px 0 4px 5px;
  border-color: transparent transparent transparent var(--muted);
  transition: transform 0.15s ease;
}
.detail-timeline-fold-btn:hover::before,
.detail-timeline-fold-btn:focus-visible::before {
  border-left-color: var(--ink-2);
}
.detail-timeline-fold-btn[aria-expanded="true"]::before {
  transform: rotate(90deg);
}
.detail-timeline-rug {
  z-index: 1;
  position: absolute;
  top: 50%;
  left: calc(var(--lo) - 3px);
  width: calc(var(--hi) - var(--lo) + 6px);
  height: 14px;
  transform: translateY(-50%);
  min-width: 8px;
  border-radius: 3px;
  background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--border);
}
.detail-timeline-rug-tick {
  z-index: 2;
  position: absolute;
  top: 50%;
  left: var(--x);
  width: 1.5px;
  height: 10px;
  transform: translate(-50%, -50%);
  background: var(--muted);
}
.detail-timeline-range {
  grid-column: 3 / -1;
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}
.detail-timeline-fold-words {
  display: block;
  color: var(--ink-2);
}
.detail-timeline-axis-row {
  min-height: 0;
  border-top: 1px solid var(--border-strong);
}
.detail-timeline-axis {
  grid-column: 2;
  position: relative;
  height: 20px;
  container-type: inline-size;
  font-size: 10.5px;
  color: var(--muted);
}
.detail-timeline-year {
  position: absolute;
  top: 6px;
  left: var(--x);
  transform: translateX(-50%);
}
.detail-timeline-year::before {
  content: "";
  position: absolute;
  top: -6px;
  left: 50%;
  height: 4px;
  border-left: 1px solid var(--border-strong);
}
.detail-timeline-year.is-first,
.detail-timeline-year.is-after {
  transform: none;
}
.detail-timeline-year.is-first::before,
.detail-timeline-year.is-after::before {
  left: 0;
}
.detail-timeline-year.is-after {
  padding-left: 3px;
}
.detail-timeline-year.is-before {
  transform: translateX(-100%);
  padding-right: 3px;
}
.detail-timeline-year.is-before::before {
  left: 100%;
}
.detail-timeline-today {
  position: absolute;
  top: 6px;
  right: 0;
  color: var(--ink-2);
}

.detail-timeline-key {

@media (forced-colors: active) {

  .detail-timeline-tail,
  .detail-timeline-guide,
  .detail-timeline-rug-tick,
  .detail-timeline-swatch,
  .detail-timeline-swatch-line,
  .detail-timeline-guide-cap,
  .detail-timeline-swatch-guide,

  }
  .detail-timeline-guide-cap.is-left,

  }
  .detail-timeline-row.is-mine::before,

    border-color: Highlight;
  }
  .detail-timeline-row.is-newest::before,

  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  line-clamp: 3;
  overflow: hidden;
}
.rl-sh-all {
  margin-top: 2px;
  font-size: 11.5px;
}
.rl-sh-under {
  font-family: var(--sans);
  font-size: 11.5px;
  color: var(--muted);
}
.rl-sh-note {
  margin: 10px 0 0;
  font-size: 11.5px;
}
@container rl (min-width: 600px) {
  .rl-sh-list.is-many {
    grid-template-columns: max-content max-content minmax(0, 1fr);
  }
  .rl-sh-list.is-many .rl-sh-name {
    grid-column: auto;
  }
  .rl-sh-list.is-many.is-labelled {
    padding-top: 16px;
  }
  .rl-sh-list.is-many .rl-sh-scale.is-labelled {
    margin-top: 0;
  }
}

@media (forced-colors: active) {
  .rl-sh-dot,
  .rl-sh-tick,
  .rl-sh-tick-label {
    forced-color-adjust: none;
  }
  .rl-sh-dot {
    background: CanvasText;
  }
  .rl-sh-dot.is-past {
    background: Canvas;
    box-shadow: inset 0 0 0 1.5px CanvasText;
  }
  .rl-sh-tick,
  .rl-sh-tick-label {
    border-color: CanvasText;
    color: CanvasText;
  }
}
@media print {
  .rl-sh-dot {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .rl-sh-dep {
    display: inline-block;
    max-width: 100%;
  }
  .rl-sh-names.is-clamped {
    display: block;
    overflow: visible;
  }
  .rl-sh-item {
    break-inside: avoid;
  }
}
.rl {
  container: rl / inline-size;
  --rl-pad: 8px;
  --rl-rank: 22px;
  --rl-gap: 8px;
  --rl-tog: 30px;
  --rl-age-w: 100%;
  --rl-pad-y: 10px;
  --rk-pad-y: 7px;
  --rk-step: 16px;
  --fl-num: 64px;
}
.rl-answer {
  margin: 2px 0 6px;
  max-width: 48em;
  font-family: var(--serif);
  font-size: 18px;
  line-height: 1.32;
  color: var(--ink-2);
  text-wrap: pretty;
}
.rl-answer b {
  font-weight: 600;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.rl-answer .rl-pk {
  font-size: 0.84em;
  font-weight: 650;
}
.rl-pk {
  font-family: var(--sans);
  font-size: 12.5px;
  color: var(--ink);
}
.rl-vw {
  color: var(--ink);
  font-weight: 600;
  white-space: nowrap;
}
.rl-vw::before,
.rk .fc-verdict::before,
.rr-pkg .tag::before,
.rl-key-dot {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  margin-right: 4px;
  border-radius: 50%;
  background: var(--tone);
  vertical-align: 0.14em;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.rl-scope {
  margin: 0 0 8px;
  max-width: 60em;
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted);
}
.rl-scope b {
  font-weight: 600;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.rl-tails {
  margin: 0 0 8px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--muted);
}
.rl-key {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 18px;
  margin: 0 0 12px;
  font-size: 12px;
  line-height: 18px;
  color: var(--muted);
}
.rl-key-item {
  display: inline-flex;
  align-items: center;
  gap: 2px;
}
.rl-key-item .rl-u:last-of-type {
  margin-right: 6px;
}
.rl-key-dot {
  margin-right: 0;
}
.rl-key-dot:last-of-type,
.rl-key-tick:last-of-type {
  margin-right: 6px;
}
.rl-key-tick.is-context {
  width: 1px;
  background: color-mix(in srgb, var(--muted) 80%, var(--border-strong));
}
.rl-key-tick {
  display: inline-block;
  width: 2px;
  height: 12px;
  margin-right: 3px;
  border-radius: 1px;
  background: var(--tone);
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.rl-key-dash {
  margin-right: 5px;
  font-family: var(--mono);
  font-weight: 600;
  color: var(--ink-2);
}
.rl-jump {
  appearance: none;
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  font: inherit;
  color: var(--ink-2);
  text-align: left;
  text-decoration: underline;
  text-decoration-color: var(--border-strong);
  text-underline-offset: 2px;
  cursor: pointer;
  overflow-wrap: anywhere;
}
.rl-jump:hover {
  color: var(--accent-ink);
  text-decoration-color: currentColor;
}
.rl-head {
  position: sticky;
  top: 0;
  z-index: 3;
  display: grid;
  grid-template-columns: var(--rl-rank) minmax(0, 1fr) var(--rl-tog);
  column-gap: var(--rl-gap);
  height: 36px;
  padding: 0 var(--rl-pad);
  background: var(--bg);
  border-bottom: 1px solid var(--border-strong);
  box-shadow: 0 -3px 0 var(--bg);
  font-family: var(--cond);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
}
@media (min-width: 760px) {
  .rl-head {
    top: var(--topbar-h);
  }
}
.rl-h {
  display: none;
  align-self: end;
  min-width: 0;
  padding-bottom: 7px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.rl-head .fhead-age {
  grid-column: 2 / 4;
  grid-row: 1;
}
.rl-head[hidden] {
  display: none;
}
.rl-head.is-own {
  border-top: 0;
}

.rl-list,
.rl-receipt,
.rr-kids {
  list-style: none;
  margin: 0;
  padding: 0;
}
.rrow {
  position: relative;
  border-bottom: 1px solid var(--border);
}
.rrow:focus-visible {
  outline: none;
}
.rrow:focus-visible > .rr-line {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
.rr-line {
  --row-bg: var(--bg);
  position: relative;
  display: grid;
  grid-template-columns: var(--rl-rank) minmax(0, 1fr) var(--rl-tog);
  grid-template-areas:
    "rank pkg tog"
    ". sq sq"
    ". say say"
    ". age age";
  column-gap: var(--rl-gap);
  row-gap: 5px;
  align-items: center;
  padding: var(--rl-pad-y) var(--rl-pad);
  background: var(--row-bg);
  cursor: pointer;
  transition: background-color 0.12s ease;
}
.rr-line:hover,
.rrow.is-open > .rr-line {
  --row-bg: var(--surface);
}
.rrow[aria-current="true"] > .rr-line {
  --row-bg: var(--accent-soft);
}
.rrow[aria-current="true"] > .rr-line::before {
  content: "";
  position: absolute;
  left: 0;
  top: -1px;
  bottom: 0;
  width: 3px;
  background: var(--accent);
}
.rr-rank {
  grid-area: rank;
  align-self: start;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  line-height: 20px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}
.rr-pkg {
  grid-area: pkg;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 8px;
  min-width: 0;
  font-size: 14px;
  line-height: 20px;
}
.rr-name {
  min-width: 0;
  overflow-wrap: anywhere;
}
.rl-vendor {
  font-weight: 400;
  color: var(--ink-2);
}
.rl-name {
  display: inline-block;
  max-width: 100%;
  font-weight: 650;
  color: var(--ink);
}
.rr-pkg .tag {
  font-family: var(--cond);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.07em;
  line-height: 15px;
  text-transform: uppercase;
  padding: 0 5px;
}
.rr-pkg .fc-dev {
  margin-left: 0;
}
.rr-pkg .tag {
  color: var(--ink-2);
  border-color: var(--border-strong);
  background: transparent;
}
.rr-pkg .tag::before {
  width: 5px;
  height: 5px;
  vertical-align: 0.1em;
}
.rl-sq {
  grid-area: sq;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.rl-sq.is-toggle {
  cursor: pointer;
}
.rl-num {
  flex: none;
  width: 22px;
  text-align: right;
  font-family: var(--sans);
  font-size: 15px;
  font-weight: 700;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.rl-num.is-zero {
  font-weight: 500;
  color: var(--muted);
}
.rl-units {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 3px 2px;
  min-width: 0;
}
.rl-u {
  flex: none;
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  background: var(--tone);
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.rl-u.is-tally {
  margin-left: 3px;
}
.rl-else {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  margin-left: 6px;
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1;
  color: var(--muted);
  white-space: nowrap;
}
.rl-u.is-else {
  border-radius: 50%;
  background: transparent;
  box-shadow: inset 0 0 0 1.25px color-mix(in srgb, var(--muted) 75%, transparent);
}
.rr-say {
  grid-area: say;
  min-width: 0;
  font-family: var(--serif);
  font-size: 15px;
  line-height: 1.35;
  color: var(--ink-2);
  text-wrap: pretty;
}
.rr-say b {
  font-weight: 600;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.rl-also {
  display: block;
  margin-top: 2px;
  font-family: var(--sans);
  font-size: 12px;
  line-height: 1.4;
  color: var(--muted);
}
.rl-quiet {
  font-family: var(--sans);
  font-size: 12.5px;
  color: var(--muted);
}
.rl .fc-age {
  grid-area: age;
  min-height: 20px;
}
.rl-age .age-track::before {
  z-index: 0;
}
.rl-whisker {
  position: absolute;
  top: 50%;
  height: 0;
  border-top: 1.5px solid color-mix(in srgb, var(--ink-2) 60%, transparent);
  transform: translateY(-50%);
}
.rl-whisker::before,
.rl-whisker::after {
  content: "";
  position: absolute;
  top: -7.75px;
  height: 14px;
  border-left: 1.5px solid color-mix(in srgb, var(--ink-2) 60%, transparent);
}
.rl-whisker::before {
  left: 0;
}
.rl-whisker::after {
  right: -1px;
}
.rl-tick {
  position: absolute;
  top: 50%;
  width: 2px;
  height: 12px;
  margin-left: -1px;
  border-radius: 1px;
  transform: translateY(-50%);
  background: var(--tone);
  z-index: 1;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.rl-tick.is-under,
.rl-key-tick.is-under {
  background: color-mix(in srgb, var(--ink-2) 75%, transparent);
}
.rl-tick.is-context {
  width: 1px;
  margin-left: -0.5px;
  background: color-mix(in srgb, var(--muted) 80%, var(--border-strong));
}
.rl-tick.is-over {
  margin-left: -3px;
}
.rl .age-num {
  white-space: nowrap;
}
.rl-age-dash {
  font-weight: 600;
  color: var(--muted);
}

.rr-tog {
  grid-area: tog;
  align-self: start;
  justify-self: end;
}
.rl-chev {
  display: grid;
  place-items: center;
  width: 28px;
  height: 24px;
  padding: 0;
  border: 1px solid transparent;
  border-radius: var(--radius-s);
  background: none;
  color: var(--muted);
  cursor: pointer;
}
.rl-chev:hover {
  border-color: var(--border-strong);
  background: var(--surface-2);
  color: var(--ink);
}
.rl-chev svg,
.rl-fold-chev svg {
  width: 12px;
  height: 12px;
  transition: transform 0.16s ease;
}
.rl-chev[aria-expanded="true"] svg,
.rl-fold-head[aria-expanded="true"] .rl-fold-chev svg {
  transform: rotate(90deg);
}
.rr-kids {
  padding-bottom: 4px;
  background: var(--surface);
  border-top: 1px solid var(--border);
}
.rk {
  --row-bg: var(--surface);
  position: relative;
  display: grid;
  grid-template-columns: var(--rl-rank) 86px minmax(0, 1fr);
  grid-template-areas:
    ". pkg pkg"
    ". verdict why"
    ". age age";
  column-gap: var(--rl-gap);
  row-gap: 2px;
  align-items: baseline;
  padding: var(--rk-pad-y) var(--rl-pad);
  border-top: 1px solid var(--border);
  background: var(--row-bg);
  font-size: 13px;
  line-height: 18px;
  cursor: pointer;
  transition:
    background-color 0.3s ease,
    outline-color 0.3s ease;
}
.rk:first-child {
  border-top: 0;
}
.rk:hover {
  --row-bg: var(--surface-2);
}
.rk[aria-current="true"] {
  --row-bg: var(--accent-soft);
  box-shadow: inset 3px 0 0 var(--accent);
}
.rk:focus-visible {
  outline-offset: -2px;
}
.rk.is-flash {
  --row-bg: var(--accent-soft);
  outline: 2px solid var(--accent);
  outline-offset: -2px;
}
.rk-pkg {
  grid-area: pkg;
  position: relative;
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0 8px;
  min-width: 0;
  padding-left: calc(var(--depth, 0) * 12px + 14px);
}
.rk-pkg::before {
  content: "";
  position: absolute;
  left: calc(var(--depth, 0) * 12px + 1px);
  top: 0;
  width: 8px;
  height: 9px;
  border-left: 1px solid var(--border-strong);
  border-bottom: 1px solid var(--border-strong);
}
.rk-via {
  font-size: 11.5px;
  color: var(--muted);
  overflow-wrap: anywhere;
}
.rk .fc-verdict {
  grid-area: verdict;
  color: var(--ink-2);
}
.rk-why {
  grid-area: why;
  overflow-wrap: break-word;
}
.rk-tree {
  display: none;
}
.rrc {
  --row-bg: var(--bg);
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  row-gap: 1px;
  padding: 8px var(--rl-pad) 9px calc(var(--rl-pad) + var(--rl-rank) + var(--rl-gap));
  border-bottom: 1px solid var(--border);
  background: var(--row-bg);
  font-size: 13px;
  line-height: 18px;
  cursor: pointer;
}
.rrc:hover {
  --row-bg: var(--surface);
}
.rrc[aria-current="true"] {
  --row-bg: var(--accent-soft);
  box-shadow: inset 3px 0 0 var(--accent);
}
.rrc:focus-visible {
  outline-offset: -2px;
}
.rrc-under,
.rrc-behind {
  font-size: 12px;
  color: var(--muted);
}
.rrc-behind .rl-pk {
  font-size: 12px;
  color: var(--ink-2);
}
.rl-fold.is-tail {
  margin-top: 22px;
  border-top: 1px solid var(--border-strong);
}
.rl-fold-head {
  display: grid;
  grid-template-columns: var(--rl-rank) minmax(0, 1fr) var(--rl-tog);
  column-gap: var(--rl-gap);
  align-items: start;
  width: 100%;
  margin: 0;
  padding: 13px var(--rl-pad) 10px;
  background: none;
  border: 0;
  border-bottom: 1px solid var(--border);
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
  transition: background-color 0.12s ease;
}
.rl-fold-head:hover {
  background: var(--surface);
}
.rl-fold-head.is-fixed {
  cursor: auto;
}
.rl-fold-head.is-fixed:hover {
  background: none;
}
.rl-fold-head:focus-visible {
  outline-offset: -2px;
}
.rl-fold-rank {
  font-family: var(--mono);
  font-size: 10.5px;
  font-weight: 600;
  line-height: 20px;
  text-align: right;
  white-space: nowrap;
  color: var(--muted);
}
.rl-fold-title {
  min-width: 0;
  font-family: var(--serif);
  font-size: 15.5px;
  line-height: 1.35;
  color: var(--ink-2);
  text-wrap: pretty;
}
.rl-fold-title b {
  font-weight: 600;
  color: var(--ink);
}
.rl-fold-sub {
  display: block;
  margin-top: 3px;
  font-family: var(--sans);
  font-size: 12px;
  line-height: 1.45;
  color: var(--muted);
}
.rl-fold-chev {
  display: grid;
  place-items: center;
  justify-self: end;
  width: 28px;
  height: 22px;
  color: var(--muted);
}
.rl-fold.is-singles .rl-fold-head {
  border-bottom-color: var(--border-strong);
}

.rl-foot b {
  font-weight: 600;
  color: var(--ink-2);
}
.rl-foot {
  margin: 20px 0 0;
  max-width: 60em;
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--muted);
}
.rl-foot .fl-unit {
  white-space: normal;
}
.rl-paren {
  white-space: nowrap;
}
@container rl (min-width: 600px) {
  .rl > * {
    --rl-rank: 26px;
    --rl-gap: 14px;
    --rl-age-w: 210px;
    --rl-pad-y: 9px;
    --rk-pad-y: 5px;
  }
  .rl-head {
    grid-template-columns: var(--rl-rank) minmax(0, 1fr) var(--rl-age-w) var(--rl-tog);
    height: 40px;
  }
  .rl-h-rank,
  .rl-h-pkg {
    display: block;
  }
  .rl-h-rank {
    text-align: right;
  }
  .rl-head .fhead-age {
    grid-column: 3;
  }
  .rr-line {
    grid-template-columns: var(--rl-rank) minmax(0, 1fr) var(--rl-age-w) var(--rl-tog);
    grid-template-areas:
      "rank pkg age tog"
      ". sq age tog"
      ". say age tog";
    row-gap: 4px;
  }
  .rr-line > .fc-age {
    align-self: stretch;
    margin-block: calc(-1 * var(--rl-pad-y)) calc(-1 * var(--rl-pad-y) - 1px);
  }
  .rl-fold-head {
    grid-template-columns: var(--rl-rank) minmax(0, 1fr) var(--rl-tog);
  }
  .rk {
    --rk-x0: calc(var(--rl-pad) + var(--rl-rank) + 4px);
    --rk-elbow-y: calc(var(--rk-pad-y) + 9px);
    grid-template-columns:
      calc(var(--rl-rank) + (var(--depth, 0) + 1) * var(--rk-step)) 86px minmax(0, 1fr)
      var(--rl-age-w) var(--rl-tog);
    grid-template-areas:
      ". pkg pkg age ."
      ". verdict why age .";
    row-gap: 0;
  }
  .rk-pkg {
    padding-left: 0;
  }
  .rk-pkg::before {
    display: none;
  }
  .rk > .fc-age {
    align-self: stretch;
    margin-block: calc(-1 * var(--rk-pad-y)) calc(-1 * var(--rk-pad-y) - 1px);
  }
  .rk-tree {
    display: block;
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: calc(var(--rk-x0) + var(--depth, 0) * var(--rk-step) + var(--rl-gap) + 8px);
    pointer-events: none;
  }
  .rk-rail,
  .rk-elbow {
    position: absolute;
    left: calc(var(--rk-x0) + var(--lvl) * var(--rk-step));
    top: 0;
    bottom: 0;
    border-left: 1px solid var(--border-strong);
  }
  .rk-elbow.is-last {
    bottom: auto;
    height: var(--rk-elbow-y);
  }
  .rk-elbow::after {
    content: "";
    position: absolute;
    left: 0;
    top: var(--rk-elbow-y);
    width: calc(var(--rl-gap) + 8px);
    border-top: 1px solid var(--border-strong);
  }
  .rk-elbow.is-last::after {
    top: 100%;
  }
  .rrc {
    grid-template-columns: minmax(0, auto) minmax(0, 1fr);
    column-gap: 14px;
    align-items: baseline;
  }
  .rrc-behind {
    grid-column: 1 / -1;
  }
}
@container rl (min-width: 990px) {
  .rl > * {
    --rl-gap: 16px;
    --rl-age-w: 200px;
    --rl-pad-y: 8px;
    --rk-pad-y: 4px;
  }
  .rl-head {
    grid-template-columns:
      var(--rl-rank) minmax(0, 1.05fr) var(--rl-sq) minmax(0, 1.55fr) var(--rl-age-w)
      var(--rl-tog);
    height: 42px;

  .rl-h-sq,
