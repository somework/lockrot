}

  content: "";

  left: 0;

  top: 50%;
  height: 1px;
  background: var(--border);
}

  position: absolute;

  position: absolute;
  left: 0;
  top: 3px;

  width: 100%;

  position: relative;

  height: 100%;

  -webkit-print-color-adjust: exact;

  border-right: 0;
}

  background: repeating-linear-gradient(-45deg, var(--tone-mark) 0 1.5px, var(--tone-soft) 1.5px 3.5px);
  box-shadow: inset 0 0 0 1px var(--tone-mark);
}

  background:
    radial-gradient(circle, var(--tone-mark) 0 1px, transparent 1.3px) 0 0 / 4px 4px,
    var(--tone-soft);
  box-shadow: inset 0 0 0 1px var(--tone-mark);
}
.sbar-seg.is-cut::after {
  content: "";
  position: absolute;
  right: 5px;
  top: -3px;
  bottom: -3px;
  width: 3px;
  background: var(--row-bg, var(--bg));
  transform: skewX(-24deg);
}

  content: "›";
  position: absolute;
  right: -9px;

  display: none;

    border: 1px solid CanvasText;

    box-shadow: none;
    forced-color-adjust: none;
  }
  .sbar-seg.is-corroborating {
    border-style: dashed;

    border-style: dotted;

    color: CanvasText;
  }
}

.sort-btn {
  background: none;
  border: 0;
  padding: 0;
  margin: 0;
  cursor: pointer;
  font: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  color: inherit;
}
.sort-btn {
  border-radius: var(--radius-s);
  text-decoration: underline transparent;
  text-underline-offset: 4px;
  transition:
    color 0.12s ease,
    text-decoration-color 0.12s ease;
}
.sort-btn:hover {
  color: var(--ink-2);
  text-decoration-color: var(--border-strong);
}
.sort-btn:focus-visible {
  outline-offset: 3px;
}
.sort-btn.active {
  color: var(--ink);
  text-decoration-color: var(--accent);
}
.sect {
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.sect > h3 {
  margin: 0;
  font-size: var(--text-s);
  font-family: var(--cond);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.kv {
  display: grid;
  grid-template-columns: minmax(84px, auto) minmax(0, 1fr);
  gap: 4px 12px;
  font-size: var(--text-s);
}
.kv dt {
  color: var(--muted);
}
.kv dd {
  margin: 0;
  font-family: var(--mono);
  font-size: var(--text-s);
  word-break: break-word;
}
.run-sections {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}
.is-clipped {
  display: inline-block;
  max-width: 18ch;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  vertical-align: bottom;
}
.pkg-word {
  display: inline-block;
  max-width: 100%;
}
.fledger {
  container: fledger / inline-size;
  --fl-pad-l: 14px;
  --fl-pad-r: 10px;
  --fl-gap: 10px;
  --fl-verdict: 86px;
  --fl-age-x: 50px;
  --fl-age: 132px;
  --fl-num: 28px;
  --fl-whose: 22px;
  --fl-pad-y: 7px;
}
.fhead {
  position: sticky;
  top: 0;
  z-index: 3;
  display: grid;
  grid-template-columns: var(--fl-verdict) var(--fl-age-x) minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas:
    "age age key"
    "age age reach";
  column-gap: var(--fl-gap);
  align-items: end;
  height: 40px;
  padding: 0 var(--fl-pad-r) 0 var(--fl-pad-l);
  background: var(--bg);
  border-bottom: 1px solid var(--border-strong);
  box-shadow: 0 -3px 0 var(--bg);
  font-family: var(--cond);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--muted);
}
@media (min-width: 760px) {
  .fhead {
    top: var(--topbar-h);
  }
}
.fhead-col {
  min-width: 0;
  padding-bottom: 7px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.fhead-age {
  grid-area: age;
  align-self: stretch;
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--fl-num);
  column-gap: 6px;
}
.fhead-axis {
  position: relative;
  height: 100%;
}
.fhead-axis-label {
  position: absolute;
  top: 5px;
  left: 0;
  white-space: nowrap;
}
.fhead-tick {
  position: absolute;
  bottom: 0;
  padding-bottom: 7px;
  font-family: var(--mono);
  font-size: var(--text-xs);
  font-weight: 500;
  letter-spacing: 0;
  line-height: 1;
  text-transform: none;
  white-space: nowrap;
}
.fhead-tick.is-start {
  left: 0;
}
.fhead-tick.is-end {
  right: 0;
}
.fhead-tick.is-warn,
.fhead-tick.is-high {
  color: var(--tone);
  padding-left: 3px;
  padding-top: 0;
  border-left: 1px dashed color-mix(in srgb, var(--tone) 55%, transparent);
  height: 17px;
  display: flex;
  align-items: flex-end;
}
.fhead-tick.is-high {
  border-left-style: dotted;
}
.fgroup {
  margin-top: 26px;
}
.fhead + .fgroup {
  margin-top: 14px;
}
.fgroup-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  column-gap: 12px;
  row-gap: 3px;
  padding: 0 var(--fl-pad-r) 9px var(--fl-pad-l);
  border-bottom: 1px solid var(--border-strong);
}
.fgroup-head h2 {
  margin: 0;
  font-family: var(--cond);
  font-size: var(--text-s);
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--tone);
  white-space: nowrap;
}
.fgroup-count {
  font-family: var(--mono);
  font-size: var(--text-s);
  color: var(--muted);
  white-space: nowrap;
}

.frows {
  list-style: none;
  margin: 0;
  padding: 0;
}
.frun {
  position: relative;
}
.frun::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  border-left: 2px solid var(--tone);
  z-index: 1;
  pointer-events: none;
}
.frun-note {
  margin: 0;
  padding: 10px var(--fl-pad-r) 8px var(--fl-pad-l);
  font-family: var(--serif);
  font-size: var(--text-base);
  line-height: 1.35;
  color: var(--ink-2);
  border-bottom: 1px solid var(--border);
}
.frun-note b {
  font-weight: 600;
  color: var(--ink);
}
.frun-note .mono {
  font-size: 0.86em;
}
.frow {
  --row-bg: var(--bg);
  position: relative;
  display: grid;
  grid-template-columns: var(--fl-verdict) var(--fl-age-x) minmax(0, 1fr);
  grid-template-areas:
    "pkg pkg pkg"
    "verdict why why"
    "age age reach";
  column-gap: var(--fl-gap);
  row-gap: 1px;
  align-items: baseline;
  padding: var(--fl-pad-y) var(--fl-pad-r) var(--fl-pad-y) var(--fl-pad-l);
  border-bottom: 1px solid var(--border);
  background: var(--row-bg);
  font-size: var(--text-s);
  line-height: 18px;
  cursor: pointer;
  transition: background-color 0.12s ease;
}
.frow:hover {
  --row-bg: var(--surface);
}
.frow[aria-current="true"] {
  --row-bg: var(--accent-soft);
}
.frow[aria-current="true"]::before {
  content: "";
  position: absolute;
  left: 0;
  top: -1px;
  bottom: 0;
  width: 3px;
  background: var(--accent);
  z-index: 2;
}
.frow:focus-visible {
  outline-offset: -2px;
}
.fcell {
  min-width: 0;
  overflow-wrap: anywhere;
}

.fc-pkg {
  grid-area: pkg;
  font-weight: 600;
  color: var(--ink);
}
.fc-vendor {
  font-weight: 400;
  color: var(--ink-2);
}
.fc-name {
  color: var(--ink);
}
.fc-ver {
  font-family: var(--mono);
  font-size: var(--text-xs);
  font-weight: 400;
  color: var(--muted);
}
.fc-pkg .tag {
  margin-left: 6px;
}
.fc-unit {
  display: inline-block;
  max-width: 100%;
}
.fc-dev {
  display: inline-block;
  margin-left: 6px;
  padding: 0 4px;
  font-family: var(--mono);
  font-size: var(--text-xs);
  line-height: 14px;
  color: var(--muted);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-s);
}
.frow .tag {
  font-size: var(--text-xs);
  line-height: 15px;
  padding: 0 5px;
  vertical-align: 1px;
}
.fc-vendor.is-ditto {
  color: var(--muted);
}
.fc-age {
  grid-area: age;
  align-self: stretch;
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--fl-num);
  column-gap: 6px;
  align-items: center;
  min-height: 18px;
  overflow: hidden;
}
.age-track {
  position: relative;
  grid-column: 1;
  grid-row: 1;
  align-self: stretch;
}
.age-track::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 1px;
  background: var(--border);
}
.age-guide {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 0;
  border-left: 1px dashed color-mix(in srgb, var(--tone) 55%, transparent);
  z-index: 1;
  --tone: var(--med);
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.age-guide.is-high {
  --tone: var(--crit);
  border-left-style: dotted;
}
.age-bar {
  position: absolute;
  left: 0;
  top: 50%;
  height: 6px;
  transform: translateY(-50%);
  border-radius: 0 var(--radius-s) var(--radius-s) 0;
  background: var(--ink-2);
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.age-bar.is-high::before {
  content: "";
  position: absolute;
  right: 0;
  top: -4px;
  bottom: -4px;
  width: 3px;
  background: var(--ink);
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.age-bar.is-over {
  border-radius: 0;
}
.age-bar.is-over::after {
  content: "";
  position: absolute;
  right: 6px;
  top: -3px;
  bottom: -3px;
  width: 3px;
  background: var(--row-bg);
  transform: skewX(-24deg);
}
.age-num {
  grid-column: 2;
  grid-row: 1;
  font-family: var(--mono);
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
  text-align: right;
  color: var(--ink-2);
}
@container fledger (max-width: 339px) {
  .fledger > * {
    --fl-age-x: 36px;
  }
  .fhead-axis-label {
    letter-spacing: 0.03em;
  }
}
@container fledger (min-width: 480px) {
  .fledger > * {
    --fl-pad-y: 5px;
  }
  .fhead {
    grid-template-columns: var(--fl-verdict) minmax(0, 1fr) var(--fl-age);
    grid-template-areas:
      "key key age"
      "pkg pkg age";
  }
  .fhead-axis-label {
    left: auto;
    right: calc(-6px - var(--fl-num));
  }
  .frow {
    grid-template-columns: var(--fl-verdict) minmax(0, 1fr) var(--fl-age);
    grid-template-areas:
      "line line age"
      "verdict why age";
    row-gap: 0;
  }
  .fc-pkg {
    flex: 0 1 auto;
  }
  .fc-age {
    margin-block: calc(-1 * var(--fl-pad-y)) calc(-1 * var(--fl-pad-y) - 1px);
  }
}
@container fledger (min-width: 990px) {
  .fledger > * {
    --fl-age: 160px;
    --fl-verdict: 90px;
    --fl-gap: 14px;
    --fl-pad-y: 4px;
  }
  .fhead {
    grid-template-columns:
      var(--fl-verdict) minmax(0, 1.15fr) minmax(0, 1.3fr) var(--fl-age)
      minmax(0, 0.95fr);
    grid-template-areas:
      ". . key age ."
      "verdict pkg why age reach";
  }
  .fhead-axis-label {
    left: 0;
    right: auto;
  }
  .frow {
    grid-template-columns:
      var(--fl-verdict) minmax(0, 1.15fr) minmax(0, 1.3fr) var(--fl-age)
      minmax(0, 0.95fr);
    grid-template-areas: "verdict pkg why age reach";
    align-items: center;
    min-height: 36px;
  }
}
@media (forced-colors: active) {
  .age-track::before,
  .age-guide,
  .age-bar,
  .fhead-tick,
  .frun::before,
  .frow[aria-current="true"]::before {
    forced-color-adjust: none;
  }
  .age-track::before {
    display: none;
  }
  .age-guide,
  .fhead-tick.is-warn,
  .fhead-tick.is-high {
    border-left-color: CanvasText;
  }
  .fhead-tick,
  .fhead-tick.is-warn,
  .fhead-tick.is-high {
    color: CanvasText;
  }
  .age-bar {
    background: Canvas;
    box-shadow: inset 0 0 0 1px CanvasText;
  }
  .age-bar.is-high::before {
    background: CanvasText;
  }
  .age-bar.is-over::after {
    background: Canvas;
  }
  .frun::before {
    border-left-color: CanvasText;
  }
  .frow[aria-current="true"]::before {
    background: Highlight;
  }
  .frow[aria-current="true"] {
    outline: 2px solid Highlight;
    outline-offset: -2px;
  }
}
@media print {
  .fhead {
    position: static;
    background: none;
    box-shadow: none;
  }
  .frow,
  .frow:hover,
  .frow[aria-current="true"] {
    --row-bg: transparent;
  }
  .frow[aria-current="true"]::before {
    display: none;
  }
  .frun::before {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
}
.f2-ledger .f2-head,
.f2-ledger .f2-row {
  --sbar-w: 72px;
  --gate-w: 64px;
}
.f2-ledger .sbar {
  --sbar-w: inherit;
}
.f2-score {
  grid-area: score;
  display: flex;
  align-items: center;
  gap: 6px;
}
.f2-num {
  width: var(--fl-num);
  text-align: right;
  font: 600 var(--text-s) var(--mono);
  font-variant-numeric: tabular-nums;
  color: var(--tone);
}
.f2-pkg {
  grid-area: pkg;
}
span.f2-unit {
  display: inline;
  white-space: nowrap;
}
.f2-ledger .f2-pkg,
.f2-ledger .f2-reach {
  overflow: hidden;
  text-overflow: ellipsis;
}
.f2-gate {
  flex: none;
  box-sizing: border-box;
  width: var(--gate-w);
  padding: 0 3px;
  border: 1px solid color-mix(in srgb, var(--crit) 55%, transparent);
  border-radius: var(--radius-s);
  font: 600 var(--text-xs)/15px var(--sans);
  text-align: center;
  white-space: nowrap;
  color: var(--crit);
}
.f2-gate.is-quiet {
  border-color: var(--border);
  color: var(--muted);
}
.f2-ready {
  display: block;
  width: fit-content;
  margin-bottom: 1px;
  padding: 0 4px;
  border: 1px solid color-mix(in srgb, var(--none) 55%, transparent);
  border-radius: var(--radius-s);
  background: var(--none-soft);
  font: 600 var(--text-xs)/15px var(--sans);
  white-space: nowrap;
  vertical-align: 1px;
  color: var(--none);
}
@media (forced-colors: active) {
  .f2-gate,
  .f2-ready,
  .f2-major {
    border-color: CanvasText;
    color: CanvasText;
  }
  .f2-gate.is-quiet {
    border-style: dashed;
  }
  .f2-major {
    border-style: dotted;
  }
}
.f2-flags {
  grid-area: flags;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 3px 5px;
}
.f2-flags .fp {
  flex: none;
}
.f2-accepted {
  flex-basis: 100%;
  font-size: var(--text-xs);
  color: var(--muted);
}
.f2-ledger .f2-age {
  grid-area: age;
}
.f2-years {
  color: var(--muted);
}
.f2-reach {
  grid-area: reach;
  font-size: var(--text-s);
  color: var(--muted);
}
.f2-held .f2-name {
  color: var(--ink);
}
.f2-more {
  font-size: var(--text-s);
  color: var(--muted);
  white-space: nowrap;
}
.f2-next {
  grid-area: next;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 3px;
  font-size: var(--text-s);
  color: var(--ink);
}
.f2-held {
  font-size: var(--text-s);
  color: var(--muted);
}
.f2-cmd {
  max-width: 100%;
  padding: 0 5px;
  border-radius: var(--radius-s);
  background: var(--surface-2);
  font: var(--text-xs)/17px var(--mono);
  color: var(--ink-2);
  white-space: normal;
}
.f2-meta {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  column-gap: 8px;
  align-items: baseline;
  align-self: stretch;
}
.f2-after {
  font-size: var(--text-s);
  color: var(--muted);
}
.f2-major {
  padding: 0 4px;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-s);
  font: 600 var(--text-xs)/15px var(--sans);
  white-space: nowrap;
  color: var(--muted);
}
.fgroup-major {
  font-size: var(--text-s);
  color: var(--muted);
}

.f2 {
  container: f2 / inline-size;
}
.f2-cmd::before {
  content: "$ ";
  color: var(--muted);
}
.f2-word {
  display: inline-block;
  max-width: 100%;
  overflow-wrap: anywhere;
}
.f2-note {
  margin: 0 0 10px;
}
.fgroup-gate {
  font: 600 var(--text-xs) var(--cond);

  text-transform: uppercase;
  color: var(--crit);
}
.f2-lbl {

  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.f2-ledger .f2-head {
  position: absolute;
  width: 1px;

  white-space: nowrap;
}
.fgroup-head > .f2-span-cell {

  align-items: baseline;

  row-gap: 3px;

.f2-head-score {

.f2-head-label {

.f2-head-tick {

.f2-head-pkg {

.f2-head-flags {

.f2-head-next {

.f2-ledger .f2-row .f2-score .sbar {

.f2-ledger .f2-row .f2-score .f2-num {
