    forced-color-adjust: none;
    border-left-color: CanvasText;
  }

}

    color: CanvasText;

  white-space: nowrap;
}
.af-value {
  font-weight: 500;
  overflow-wrap: anywhere;
}
.af-x {
  position: relative;
  flex: 0 0 auto;
  align-self: center;
  width: 14px;
  height: 14px;
  border-radius: 50%;
}
.af-x::before,
.af-x::after {
  content: "";
  position: absolute;
  left: 3px;
  right: 3px;
  top: 50%;
  border-top: 1.5px solid var(--ink-2);
  transform: rotate(45deg);
}
.af-x::after {
  transform: rotate(-45deg);
}
.af-chip:hover .af-x {
  background: var(--accent-soft);
}
@media (forced-colors: active) {
  .af-chip {
    border-color: ButtonText;
  }
  .af-x::before,
  .af-x::after {
    border-top-color: ButtonText;
  }
}
@media print {
  .af {
    display: none;
  }
}
@page {
  margin: 15mm 13mm 16mm;

  @top-left {
    content: var(--lr-running-head, "");
    font: 7.5pt/1.2 var(--mono);
    color: #536562;
    vertical-align: bottom;
    padding-bottom: 3mm;
  }
  @bottom-right {
    content: "page " counter(page) " of " counter(pages);
    font: 7.5pt/1.2 var(--mono);
    color: #536562;
    vertical-align: top;
    padding-top: 3mm;
  }
}
@page :first {
  @top-left {
    content: none;
  }
}

@media print {
  :root:root:root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #eef2f1;
    --surface-3: #e3e9e7;
    --border: #cfd9d6;
    --border-strong: #9fb0ac;
    --ink: #0f1a19;
    --ink-2: #3a4b49;
    --muted: #536562;
    --accent: #0f766e;
    --accent-soft: #d7ece8;
    --accent-ink: #0a574f;
    --crit: #a92b1f;
    --crit-soft: #f6dfdc;
    --high: #955005;
    --high-soft: #f7e7d3;
    --med: #7c6300;
    --med-soft: #f4edd2;
    --low: #456472;
    --low-soft: #dfe9ee;
    --none: #366b4b;
    --none-soft: #dcebe1;
    --flag-abandoned: #2a78d6;
    --flag-silent: #eb6834;
    --flag-pinned: #1baf7a;
    --flag-left-behind: #eda100;
    --flag-old-promise: #e87ba4;
    --flag-stale: #008300;
    --flag-vulnerable: #6250d6;
    --shadow: none;
    --gutter: 0px;
    color-scheme: light;
  }
  body {
    background: #fff;
    color: #000;
  }

  .topbar {
    position: static;
    box-shadow: none;
    border-bottom: 2px solid var(--ink);
  }
  .topbar-in {
    padding-top: 0;
    padding-bottom: 8px;
  }
  .print-doc:not(:empty) ~ main {
    display: none;
  }
  .tabs-strip,
  .shell-rail,
  .rail-fold,
  .searchbar,
  .hint,
  .shell-detail,
  .glossary-open,
  .theme-toggle,
  .share-actions,
  .fact-btn-icon,
  .fact-pop {
    display: none !important;
  }
  .fact-btn {
    border: none;
    padding: 0;
    color: inherit;
  }

  .shell {
    display: block;
    max-width: none;
    padding: 0;
  }

  [role="option"],
  [role="row"],
  [role="listitem"],
  article {
    break-inside: avoid;
    border-color: #999;
  }
  .colophon {
    display: block;
    border-top-color: #999;
    padding: 8px 0 0;
    font-size: 10.5px;
    line-height: 1.5;
    break-inside: avoid;
  }
  .colophon > p {
    margin: 0 0 4px;
  }
  .colophon > p:nth-last-of-type(2),
  .colophon > p:last-of-type {
    display: inline;
  }
  .colophon > p:last-of-type::before {
    content: " · ";
  }
  .colophon .cta {
    padding: 3px 10px;
    line-height: 1.55;
  }
  .colophon .cta {
    background: none;
    border-left-color: #999;
  }
  .brand .dot,
  .waffle-cell,
  .legend-seg,
  .advisory-square,
  .swatch,
  .pill,
  .fgroup-head h2,
  .lead-chips .count,
  .ov-grade {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  .ledger,
  .ledger-lead {
    break-inside: avoid;
  }
}
@media print {
  .pd {
    font-size: 12px;
  }
  .pd-intro {
    margin: 10px 0 2px;
    font: 15px/1.45 var(--serif);
    color: var(--ink);
  }
  .pd-intro-lead {
    margin-right: 0.4em;
  }
  .pd-toc-item {
    white-space: nowrap;
    color: var(--ink-2);
  }
  .pd-toc-item + .pd-toc-item::before {
    content: "·";
    margin: 0 0.45em;
    color: var(--muted);
  }
  .pd-toc-num {
    font: 600 10px var(--mono);
    color: var(--muted);
  }
  .pd-intro-note {
    margin: 0 0 4px;
    font-size: 11px;
    color: var(--muted);
  }

  .pd-sect {
    margin-top: 26px;
  }
  .pd-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 2px 16px;
    padding-bottom: 4px;
    border-bottom: 1.5px solid var(--ink);
    break-after: avoid;
    break-inside: avoid;
  }
  .pd-title {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0;
    font: 600 19px/1.2 var(--serif);
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .pd-num {
    font: 600 11px var(--mono);
    color: var(--muted);
  }
  .pd-lede {
    margin: 8px 0 10px;
    font: 14px/1.4 var(--serif);
    color: var(--ink-2);
  }
  .pd-lede.is-lead {
    break-after: avoid;
  }
  .pd-lede {
    break-inside: avoid;
  }
  .pd-findings .empty,
  .pd-advisories .empty {
    display: none;
  }
  .pd-lede b {
    color: var(--ink);
    font-weight: 600;
  }
  .pd .ledger {
    padding: 12px 0 0;
  }
  .pd .lead-chips .legend-btn {
    padding: 3px 9px 3px 8px;
  }
  .pd .fhead,
  .pd .advgroup > header {
    break-after: avoid;
  }
  .pd .adv-list > :first-child {
    break-before: avoid;
  }
  .pd .fledger > * {
    --fl-age: 184px;
    --fl-gap: 18px;
  }
  .pd .fhead-tick.is-start {
    display: flex;
    align-items: flex-end;
    height: 17px;
    padding-left: 3px;
    border-left: 1px solid var(--border-strong);
  }
  .pd .tablewrap {
    overflow: visible;
    background: none;
    border: 0;
    border-radius: 0;
  }
  .pd .tablewrap table {
    font-size: 10px;
  }
  .pd .tablewrap th,
  .pd .tablewrap td {
    padding: 4px 5px;
    white-space: normal;
  }
  .pd .tablewrap td:first-child {
    overflow-wrap: anywhere;
  }
  .pd .tablewrap .lnk {
    border-bottom: 0;
  }
  .pd .tablewrap td:not(:first-child) {
    white-space: nowrap;
  }
  .pd .tablewrap .pill {
    font-size: 8px;
    padding: 1px 4px;
  }
  .pd .tablewrap th {
    position: static;
    font-size: 8.5px;
    border-bottom-color: var(--border-strong);
  }
  .pd button,
  .pd .pkg-link-btn {
    text-decoration: none;
    color: inherit;
  }
  .pd a {
    text-decoration: none;
  }
  .pd-run .run-sections {
    gap: 8px;
    padding-top: 6px;
  }
  .pd-run .sect {
    margin-top: 0;
    gap: 5px;
    break-inside: avoid;
  }
  .pd-run .note {
    margin: 0;
    padding: 6px 10px;
  }
  .pd-run .sect h3 {
    margin: 0 0 4px;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
}
@media print and (min-width: 1000px) {
  body {
    padding: 0 24px;
  }
}
