  font-size: 12px;
  color: var(--muted);
}
.colophon .cta {
  margin-top: 4px;
  padding: 9px 12px;
  border-left: 2px solid var(--accent);
  background: var(--surface-2);
  border-radius: 0 6px 6px 0;
  color: var(--ink-2);
  line-height: 1.7;
}
.colophon .cta code {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 1px 6px;
  border-radius: var(--radius-s);
  font-size: 11px;
  color: var(--ink);
  white-space: nowrap;
}
@media (max-width: 480px) {
  .colophon .cta code {
    white-space: normal;
    overflow-wrap: anywhere;
  }
}
@media print {
  :root {
    color-scheme: light;
  }
  body {
    background: #fff;
    color: #000;
  }

  .topbar {
    position: static;
    box-shadow: none;
  }
  .tabs,
  .shell-rail,
  .rail-fold,
  .searchbar,
  .hint,
  .shell-detail,
  .glossary-open,
  .theme-toggle {
    display: none !important;
  }

  .shell {
    display: block;
    max-width: none;
    padding: 0;
  }

  [role="option"],
  [role="row"],
  [role="listitem"],
  article {
    break-inside: avoid;
    border-color: #999;
  }

  .colophon {
    border-top-color: #999;
  }
  .colophon .cta {
    background: none;
    border-left-color: #999;
  }
}
