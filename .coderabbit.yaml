# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Most of this repository by file count is not written — it is recorded. 999 of the 1,177 files
# under tests/ are HTTP responses captured from Packagist and GitHub, and most of the rest are
# composer.lock snapshots taken from real projects. CONTRIBUTING states the rule for all of them:
# "Do not hand-edit a recorded lock file or a recorded response — a fixture that no longer matches
# the source it was taken from is worth less than no fixture." A review comment on one of those can
# therefore only ever suggest an edit that is forbidden, and 999 files of that drowns the comments
# on the dozen files somebody actually wrote.
#
# So the filters below exclude two kinds of file and nothing else: what was recorded from an
# upstream, and what a committed script regenerates. Everything authored stays reviewable —
# including the parts that look like data but are not, such as the declared expectations in
# tools/corpus/fixtures/poison.json and the curated reasons in resources/finished-packages.json.

language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  poem: false

  path_filters:
    # --- recorded from an upstream, never hand-edited ---------------------------------------
    # Packagist p2 documents and GitHub API responses, re-recorded by bin/record-fixtures.
    - '!tests/fixtures/http/**'
    # composer.lock and composer.json taken from real projects; see tests/fixtures/README.md.
    - '!tests/fixtures/apps/**'
    - '!tests/fixtures/skeletons/**'
    # Research artefacts from one-off runs over those fixtures, kept as evidence.
    - '!tests/fixtures/summary.json'
    - '!tests/fixtures/big-summary.json'
    - '!tests/fixtures/phar-summary.json'
    - '!tests/fixtures/skeletons-summary.json'
    - '!tests/fixtures/top500.json'
    - '!tests/fixtures/liveness.py'
    - '!tests/fixtures/pre8.py'
    # OASIS's own SARIF 2.1.0 schema, vendored so the output tests validate offline.
    - '!tests/fixtures/sarif/sarif-schema-2.1.0.json'
    # A prebuilt archive and the throwaway keys PharTest and the self-update tests sign with.
    - '!tests/fixtures/phar/minimal.phar'
    - '!tests/fixtures/signing/*.pem'
    - '!tests/fixtures/signing/*.pub'
    # lockrot's own pages and documents, recorded by tools/corpus/record. The text half is
    # byte-for-byte what lockrot printed and must stay that way, or the checks that read it stop
    # being able to tell a rewording from a bug.
    - '!tools/corpus/fixtures/explain/**'
    - '!tools/corpus/fixtures/claims/**'
    # Composer's own normalisation answers, extracted from the p2 documents above.
    - '!tools/corpus/fixtures/semver-oracle.json'

    # --- generated by a committed script -----------------------------------------------------
    # Written only by `tools/corpus/corpus refresh`; every line is a commit SHA and two digests.
    - '!tools/corpus/corpus.lock.json'
    # 279 hand-picked (project, package) pairs. Authored, but there is nothing in a pair for a
    # reader to judge — what it covers is stated in the file's own header.
    - '!tools/corpus/targets/*.tsv'
    # Written only by bin/refresh-monorepo-parents, from live Packagist data.
    - '!resources/monorepo-parents.json'
    # Written only by `composer update --working-dir=build/phar`; CI fails on an unexpected diff.
    - '!build/phar/composer.lock'
    # Re-recorded from a real run; the numbers in it are output, not prose.
    - '!docs/example-run.md'
    # Recorded with asciinema and rendered with agg by bin/record-demo.
    - '!docs/assets/**'

    # --- public keys, which are meant to be read by a verifier and not by a reviewer -----------
    - '!lockrot-release-key.asc'
    - '!lockrot-selfupdate-key.pub'

  path_instructions:
    - path: 'src/**/*.php'
      instructions: |
        Three floors are not negotiable and CI enforces all three, so do not suggest anything that
        breaks them:
        - PHP 7.4 is the language floor. No match expressions, enums, constructor promotion,
          readonly, union types in signatures, or str_contains()/str_starts_with() without a guard.
        - Composer 2.2 is the plugin-API floor. Anything a later Composer added needs a version
          guard.
        - Only the symfony/console 2.8 API. require-dev resolves 5.4, but the plugin runs inside a
          Composer process that bundles 2.8.52, so newer Console API passes locally and fails on
          the 2.2 row of the matrix.
        Comments here are expected to say why, usually naming the concrete bug or the measured
        number the code exists to prevent; do not suggest replacing one with a restatement of the
        code.
    - path: 'bin/**'
      instructions: |
        Extensionless PHP scripts under the same PHP 7.4 floor as src/. Note that php-cs-fixer's
        Finder covers only the files named in .php-cs-fixer.dist.php and PHPStan does not scan
        bin/ at all, so nothing here is checked automatically. Progress and errors go to STDERR and
        the single closing result line to STDOUT. A token is read as getenv('GITHUB_TOKEN') ?: null,
        where unset means anonymous rather than an error.
    - path: 'tests/**/*.php'
      instructions: |
        PHP 7.4 and 8.0 run this suite under phpunit9.xml.dist with a PHPUnit that reads only the
        @dataProvider annotation, not the #[DataProvider] attribute. A data-provider test therefore
        needs BOTH, and a test carrying only the attribute passes locally and errors on two rows of
        the matrix with "Too few arguments".
    - path: 'tools/corpus/**/*.py'
      instructions: |
        A developer-only tool that audits lockrot's output against the data lockrot read. Two rules
        decide everything here:
        - Nothing may import or shell out to lockrot's PHP, or to composer/semver, to work out what
          an answer should be. A checker that asks the subject what it is about agrees with it by
          construction and no test could detect that. Reading lockrot's JSON output is the subject
          under audit and is correct; deriving the expectation from lockrot is the fatal case.
        - Selection never touches rendered text. Whether a document is judged is computed from JSON
          fields only, and a selected document must return a verdict — a sentence that no longer
          parses is a reported problem, not a skip. A suggestion that moves a pattern into a
          selector reopens the hole the tool exists to close.
        Stdlib only, on the version in .python-version, run with unittest and compileall: there is
        no requirements.txt, no ruff, no pytest and nothing to install, following the same
        arrangement CONTRIBUTING describes for the node checks. It does not inherit the PHP 7.4
        floor.
    - path: 'resources/report/*.js'
      instructions: |
        Ships as source: the page has no build step and the PHAR is built without node. lib.js is
        the half with no DOM in it and holds the escaping, the check that keeps a javascript: URL
        out of an href, and the one that keeps a second shell command off the clipboard; it is
        covered by node's own runner in tests/js. The rest of report.js needs a browser and is not
        covered.
    - path: '.github/workflows/**'
      instructions: |
        timeout-minutes is set from a dated measurement of a real run, not guessed. ci.yml is
        triggered by pull_request and by push to main only, which its header comment explains.

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  tools:
    # CI already runs PHPStan at level max over src/ and tests/ with two configs of its own, and
    # php-cs-fixer over the same tree. A second opinion from a tool with no access to those configs
    # produces duplicate comments at best.
    phpstan:
      enabled: false
    phpmd:
      enabled: false
    phpcs:
      enabled: false
    # There is no ruff configuration in this repository and deliberately so; ruff's defaults would
    # report a style this tool does not follow, over 2,000 lines it would be the loudest voice in
    # every review.
    ruff:
      enabled: false
    # The prose here is hand-wrapped and deliberate, and mkdocs build --strict is the linter CI
    # runs on it.
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    # ci.yml uses inline flow maps throughout (`with: {php-version: '8.4'}`), which yamllint's
    # defaults report on every line.
    yamllint:
      enabled: false

chat:
  auto_reply: true
