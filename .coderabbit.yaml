# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# path_filters exclude recorded fixtures (CONTRIBUTING, "Fixtures are recorded, not written"),
# generated files, and authored data that holds nothing for a reviewer to judge. A comment on a
# recorded file can only suggest a forbidden hand edit. Authored data with a judgment in it stays
# reviewable: tools/corpus/fixtures/poison.json, resources/finished-packages.json.

language: en-US
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  poem: false

  path_filters:
    # Recorded from an upstream, never hand-edited.
    # Packagist p2 documents and GitHub API responses, re-recorded by bin/record-fixtures.
    - '!tests/fixtures/http/**'
    # composer.lock and composer.json taken from real projects; see tests/fixtures/README.md.
    - '!tests/fixtures/apps/**'
    - '!tests/fixtures/skeletons/**'
    # Research artefacts from one-off runs over those fixtures, kept as evidence.
    - '!tests/fixtures/summary.json'
    - '!tests/fixtures/big-summary.json'
    - '!tests/fixtures/phar-summary.json'
    - '!tests/fixtures/skeletons-summary.json'
    - '!tests/fixtures/top500.json'
    - '!tests/fixtures/liveness.py'
    - '!tests/fixtures/pre8.py'
    # OASIS's own SARIF 2.1.0 schema, vendored so the output tests validate offline.
    - '!tests/fixtures/sarif/sarif-schema-2.1.0.json'
    # A prebuilt archive and the throwaway keys PharTest and the self-update tests sign with.
    - '!tests/fixtures/phar/minimal.phar'
    - '!tests/fixtures/signing/*.pem'
    - '!tests/fixtures/signing/*.pub'
    # lockrot's own pages and documents, recorded by tools/corpus/record. The text half is
    # byte-for-byte what lockrot printed and must stay that way, or the checks that read it cannot
    # tell a rewording from a bug.
    - '!tools/corpus/fixtures/explain/**'
    - '!tools/corpus/fixtures/claims/**'
    # Composer's own normalisation answers, extracted from the recorded p2 documents.
    - '!tools/corpus/fixtures/semver-oracle.json'

    # Generated by a committed script, or authored with nothing to judge.
    # Written only by `tools/corpus/corpus refresh`. Every line is a commit SHA and two digests.
    - '!tools/corpus/corpus.lock.json'
    # Hand-picked (project, package) pairs with nothing for a reviewer to judge. The header of each
    # file states what it covers.
    - '!tools/corpus/targets/*.tsv'
    # Written only by bin/refresh-monorepo-parents, from live Packagist data.
    - '!resources/monorepo-parents.json'
    # Written only by `composer update --working-dir=build/phar`. CI fails on an unexpected diff.
    - '!build/phar/composer.lock'
    # Re-recorded from a real run. The numbers in it are output, not prose.
    - '!docs/example-run.md'
    # Recorded with asciinema and rendered with agg by bin/record-demo.
    - '!docs/assets/**'

    # Public keys: a verifier reads them, a reviewer has nothing to judge.
    - '!lockrot-release-key.asc'
    - '!lockrot-selfupdate-key.pub'

  path_instructions:
    - path: 'src/**/*.php'
      instructions: |
        Three floors are not negotiable and CI enforces all three, so do not suggest anything that
        breaks them:
        - PHP 7.4 is the language floor. No match expressions, enums, constructor promotion,
          readonly, union types in signatures, or str_contains()/str_starts_with() without a guard.
        - Composer 2.2 is the plugin-API floor. Anything a later Composer added needs a version
          guard.
        - Only the symfony/console 2.8 API. require-dev resolves a newer console, but the plugin runs
          inside the Composer 2.2 process that bundles console 2.8, so newer Console API passes
          locally and fails on the 2.2 rows of the matrix.
    - path: 'bin/**'
      instructions: |
        The PHP scripts (bin/lockrot, bin/record-fixtures, bin/refresh-monorepo-parents) are
        extensionless PHP under the same PHP 7.4 floor as src/. Note that php-cs-fixer's Finder
        covers only the files named in .php-cs-fixer.dist.php and PHPStan does not scan bin/ at
        all, so nothing here is checked automatically. bin/lockrot is the application entry point
        (the PHAR's stub runs it), not a script with a closing line. bin/record-fixtures writes
        progress and errors to STDERR and its single closing result line to STDOUT, and reads its
        token as getenv('GITHUB_TOKEN') ?: null, where unset means anonymous rather than an error.
        bin/refresh-monorepo-parents writes everything, its closing line included, to STDERR and
        takes credentials through Composer's Factory::create(), so it reads no token itself.
        The bash recorders (bin/record-schema-evolution, bin/record-demo) are run by hand and record
        with a GitHub token on purpose: record-schema-evolution refuses to start without
        GITHUB_TOKEN, because its provenance.json states that the recording used one and an
        anonymous run would record rate-limited answers instead of what the release writes. Do not
        suggest making the token optional there.
    - path: 'tests/**/*.php'
      instructions: |
        PHP 7.4 and 8.0 run this suite under phpunit9.xml.dist with a PHPUnit that reads only the
        @dataProvider annotation, not the #[DataProvider] attribute. A data-provider test therefore
        needs BOTH, and a test carrying only the attribute passes locally and errors on two rows of
        the matrix with "Too few arguments".
        Review against .claude/rules/tests.md. An old exact total over recorded fixtures stays
        until its per-package replacement exists. Flag a new exact total over recorded fixtures
        (tests/fixtures/apps, recorded HTTP answers), exact text that is not an output format, a
        line another tool parses or a docs sentence that states a value the code holds, the real
        clock (time(), date(), DateTime without a fixed instant) outside a test of the real clock or
        of a file modification time, the real network outside the network and e2e groups,
        reflection on private state, a mock of anything but HTTP, the clock, the file system or the
        Composer IO, a write outside a new temporary directory.
    - path: 'tools/corpus/**/*.py'
      instructions: |
        A developer-only tool that audits lockrot's output against the data lockrot read. Two rules
        decide everything here:
        - Nothing may import or shell out to lockrot's PHP, or to composer/semver, to work out what
          an answer should be. A checker that asks the subject what it is about agrees with it by
          construction and no test could detect that. Reading lockrot's JSON output is the subject
          under audit and is correct; deriving the expectation from lockrot is the fatal case.
        - Selection never touches rendered text. Whether a document is judged is computed from JSON
          fields only, and a selected document must return a verdict — a sentence that no longer
          parses is a reported problem, not a skip. A suggestion that moves a pattern into a
          selector reopens the hole the tool exists to close.
        Stdlib only, on the version in .python-version, run with unittest and compileall: there is
        no requirements.txt, no ruff, no pytest and nothing to install. It does not inherit the
        PHP 7.4 floor.
    - path: 'resources/report/**'
      instructions: |
        Vendored build output of somework/lockrot-report, brought in by tools/report/update-renderer
        after verifying its build provenance; RendererManifestTest pins report.html to the sha256
        in manifest.json. Do not review or suggest edits to these files — a change belongs in the
        renderer repository and arrives here as a new release. Review only whether a diff here came
        with a matching manifest and a CHANGELOG entry naming the renderer version.
    - path: '.github/workflows/**'
      instructions: |
        Do not suggest new triggers for ci.yml: its header comment gives the reason.
    - path: '**'
      instructions: |
        Text rules for every file (.claude/rules/writing.md, .claude/rules/code-comments.md). Check
        only text that the diff adds or changes, plus an unchanged comment that a changed line makes
        false. Flag in prose and comments: an instruction over 20 words or a description over 25
        (a code span, quote, title, title link, number with its unit, hyphenated word and
        parenthesis count as one word), a modal other than must/can/will (could as a past), a
        contraction, e.g./i.e./etc., "note that/simply/just/in order to", a semicolon outside code,
        a tense other than simple (has read, is reading), a passive with a known actor (a state
        such as abandoned or flagged is not a passive), an -ing form other than a noun, a technical
        name or missing/remaining/during, "by design/deliberately/on purpose/by choice", a time word
        (now, no longer, used to, currently, recently, not yet, until now) outside CHANGELOG.md, a
        count of a set other than the closed sets and exit codes, file:line references, a line
        number or "above/below" that points at other text. Prose terms (flag only in that meaning):
        finding (not issue/problem/result), flagged (not failing), verdict (not status/state),
        signal (not check/rule), level or priority (not severity), severity order (not ladder), run
        note (not warning/error), repository host (not forge/code host), the lock (not lock file),
        direct requirement (not direct dependency), target PHP (not PHP floor), libyears (not
        libyear). Never swap unchecked, unmeasured and unknown.
        In code and config comments (not Markdown): the default is no comment. Ask to delete, not
        reword, a comment, docblock or tag whose words name only the identifiers, literals or types
        of the code it sits on, or ask for a better name or an extraction. A comment stays only as a
        reason (a floor, an external behaviour, a refused input, a published-data requirement, the
        case a test's data must reach), a contract a caller must know, a warning about a trap, or a
        link to a spec, a repository heading or a PR. Type tags that say more than the native type,
        @throws, @internal, @phpstan-* and PHPUnit 9 annotations beside their attribute stay. Flag:
        dates, the lockrot version of a change, "was/dropped/before/after/since" about earlier code,
        run ids, timings, coverage or MSI numbers, counts of a run, a timeout, retry count or gate
        floor without its rule and a PR or commit link, a comment over six lines of text, section
        banners, commented-out code, a TODO without an issue URL.
    - path: '**/*.md'
      instructions: |
        Docs rules (.claude/rules/docs/*.md, and .claude/rules/changelog.md for CHANGELOG.md), on
        changed lines only: a paragraph over six sentences, a note that holds an instruction, a
        requirement or a limit, a fact copied from its home instead of linked, a renamed heading
        without its old id, a class, test or script name outside CONTRIBUTING.md, a console block
        with no recording changed in the same diff and no <placeholder>. In CHANGELOG.md: a release
        heading other than `## [X.Y.Z] - YYYY-MM-DD`, a **Breaking:** entry with no closing
        `Action:` sentence, an entry over five lines, a commit hash or branch link, a minor release
        without `### Verdict changes`, a leak or verification gap under `### Fixed`. In
        tests/infection-equivalents.md: an entry with a line, date, version or measurement. Do not
        suggest rewording a phrase that a test reads: search tests/ for the page's file name.
    - path: '.claude/rules/**'
      instructions: |
        Flag a rule that a reviewer cannot check from a diff, a rule that repeats another rule file
        instead of linking it, and growth: the whole directory has a budget of 440 lines (wc -l),
        so ask what an addition replaces.

  pre_merge_checks:
    # Off: .claude/rules/code-comments.md makes no comment the default, so per-function coverage
    # asks for restatements of the function name.
    docstrings:
      mode: 'off'

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main

  tools:
    # CI already runs PHPStan at level max over src/ and tests/ with two configs of its own, and
    # php-cs-fixer over the same tree. A second opinion from a tool with no access to those configs
    # produces duplicate comments at best.
    phpstan:
      enabled: false
    phpmd:
      enabled: false
    phpcs:
      enabled: false
    # No ruff configuration exists here. Ruff's defaults report a style that tools/corpus does not
    # follow, and they are the loudest voice in every review.
    ruff:
      enabled: false
    # The prose here is hand-wrapped, and mkdocs build --strict is the linter that CI runs on it.
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    # ci.yml uses inline flow maps throughout (`with: {php-version: '8.4'}`), which yamllint's
    # defaults report on every line.
    yamllint:
      enabled: false

chat:
  auto_reply: true
